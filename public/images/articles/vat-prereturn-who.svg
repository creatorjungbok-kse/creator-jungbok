<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 904" width="800" height="904" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>부가세 예정신고 누가 하나</title>
<rect width="800" height="904" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">부가세 예정신고 누가 하나</text>
<text x="40" y="114" font-size="25" fill="#615e5a">사업자 유형·직전 공급가액 기준</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">법인(1억5천만원 이상)</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">예정신고를 합니다</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">그 기간 매출이 없어도 무실적 신고</text>
<rect x="40" y="352" width="720" height="222" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="222" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">소규모 법인·개인 일반과세자</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">원칙적으로 예정신고를 하지 않음</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">대신 예정고지 세액 납부</text>
<text x="80" y="540" font-size="26" fill="#1d1b19">매출 감소·조기환급 땐 신고 선택 가능</text>
<rect x="40" y="598" width="720" height="266" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="598" width="14" height="266" rx="7" fill="#f4b400"/>
<text x="80" y="652" font-size="30" font-weight="800" fill="#1d1b19">간이과세자</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">예정신고를 하지 않음</text>
<text x="80" y="742" font-size="26" fill="#1d1b19">7월에 예정부과분 납부</text>
<text x="80" y="786" font-size="26" fill="#1d1b19">세금계산서를 발급했다면</text>
<text x="80" y="830" font-size="26" fill="#1d1b19">7월 예정부과기간 신고</text>
</svg>
