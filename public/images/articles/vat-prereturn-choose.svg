<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 816" width="800" height="816" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>예정신고를 고를 수 있는 경우</title>
<rect width="800" height="816" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">예정신고를 고를 수 있는 경우</text>
<text x="40" y="114" font-size="25" fill="#615e5a">예정고지 대상이라도 아래면 선택할 수 있어요</text>
<rect x="40" y="150" width="720" height="222" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="222" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">실적이 크게 줄었을 때</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">휴업·사업 부진 등으로 공급가액이나</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">납부세액이 직전 과세기간의</text>
<text x="80" y="338" font-size="26" fill="#1d1b19">3분의 1에 못 미치는 경우</text>
<rect x="40" y="396" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="396" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="450" font-size="30" font-weight="800" fill="#1d1b19">조기환급을 받으려 할 때</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">그 예정신고기간분에 대해</text>
<text x="80" y="540" font-size="26" fill="#1d1b19">조기환급을 받으려는 경우</text>
<rect x="40" y="598" width="720" height="178" rx="22" fill="#f4b400" stroke="#1d1b19" stroke-width="0"/>
<text x="80" y="652" font-size="30" font-weight="800" fill="#1d1b19">예정신고를 하면</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">받은 예정고지는 없었던 것으로 봐요</text>
<text x="80" y="742" font-size="26" fill="#1d1b19">기한은 4월 25일, 10월 25일</text>
</svg>
