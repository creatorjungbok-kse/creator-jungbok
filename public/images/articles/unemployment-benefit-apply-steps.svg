<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" width="1200" height="980" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>실업급여 신청 순서</title>
<rect width="1200" height="980" fill="#fdfaf2"/>
<text x="60" y="78" font-size="40" font-weight="800" fill="#1d1b19">실업급여, 이 순서로 신청해요</text>
<text x="60" y="120" font-size="25" fill="#615e5a">상용근로자 기준 · 마지막 근무일 다음 날부터 1년 안에 다 받아야 해요</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d1b19"/></marker></defs>
<g stroke="#1d1b19" stroke-width="4">
<rect x="60" y="150" width="1080" height="96" rx="16" fill="#fff"/>
<rect x="60" y="270" width="1080" height="96" rx="16" fill="#fff"/>
<rect x="60" y="390" width="1080" height="96" rx="16" fill="#fff"/>
<rect x="60" y="510" width="1080" height="96" rx="16" fill="#f4b400"/>
<rect x="60" y="630" width="1080" height="96" rx="16" fill="#fff"/>
<rect x="60" y="750" width="1080" height="96" rx="16" fill="#fff"/>
</g>
<g stroke="#1d1b19" stroke-width="4" fill="none" marker-end="url(#a)">
<path d="M150 246V266"/><path d="M150 366V386"/><path d="M150 486V506"/><path d="M150 606V626"/><path d="M150 726V746"/>
</g>
<g font-size="27" font-weight="800" fill="#1d1b19">
<text x="92" y="194">① 회사: 상실신고 · 이직확인서 제출</text>
<text x="92" y="314">② 고용24에서 구직 등록</text>
<text x="92" y="434">③ 고용24 온라인 사전 교육</text>
<text x="92" y="554">④ 고용센터 방문, 수급자격 인정 신청</text>
<text x="92" y="674">⑤ 1차 실업인정: 고용센터 출석(집체교육)</text>
<text x="92" y="794">⑥ 1주에서 4주마다 실업인정 → 다음 날 입금</text>
</g>
<g font-size="21" fill="#3d3a36">
<text x="92" y="228">상실신고는 다음 달 15일까지 · 이직확인서는 요청하면 10일 안에 발급</text>
<text x="92" y="348">일자리를 찾고 있다는 등록 · 온라인으로 가능</text>
<text x="92" y="468">못 들었으면 고용센터에서 현장 교육</text>
<text x="92" y="588" fill="#1d1b19">신분증 지참 · 본인이 직접 · 거주지 관할 고용센터</text>
<text x="92" y="708">센터에 출석해 집체교육을 이수 · 그다음 실업인정일 안내</text>
<text x="92" y="828">2차부터 온라인·모바일 가능 · 4차·8차 출석(60세 이상·장애인은 4차, 1차는 센터 안내 확인)</text>
</g>
<text x="60" y="900" font-size="22" fill="#3d3a36">실업 신고 뒤 7일 대기기간은 지급되지 않아요. 받는 중 일하면 소득과 상관없이 실업인정 때 신고해야 해요.</text>
<text x="60" y="944" font-size="19" fill="#615e5a">근거: 고용24 실업급여(상용직) 안내(2026.8.25 수정), 고용노동부 고객상담센터 상담 안내(2026년 10월 확인)</text>
</svg>
