<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 974" width="800" height="974" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>급여명세서와 금액이 다른 이유</title>
<rect width="800" height="974" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">급여명세서와 금액이 다른 이유</text>
<text x="40" y="114" font-size="25" fill="#615e5a">계산기는 월 보수 하나만 넣어요</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">신고된 금액 기준</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">국민연금은 기준소득월액을</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">7월부터 1년간 써요</text>
<rect x="40" y="352" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">비과세 급여</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">식대 등은 보통 빠지지만</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">건강보험은 일부 예외가 있어요</text>
<rect x="40" y="554" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="554" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="608" font-size="30" font-weight="800" fill="#1d1b19">나이</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">만 60세 이상은 보통 국민연금 제외</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">65세 이후 입사는 실업급여 몫 제외</text>
<rect x="40" y="756" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="756" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="810" font-size="30" font-weight="800" fill="#1d1b19">감면·지원</text>
<text x="80" y="856" font-size="26" fill="#1d1b19">두루누리 지원, 보험료 감면은</text>
<text x="80" y="900" font-size="26" fill="#1d1b19">계산기에 반영하지 않았어요</text>
</svg>
