<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 772" width="800" height="772" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>일찍·제때·늦게 받을 때</title>
<rect width="800" height="772" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">일찍·제때·늦게 받을 때</text>
<text x="40" y="114" font-size="25" fill="#615e5a">1969년 이후 출생자 기준</text>
<rect x="40" y="150" width="720" height="222" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="222" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">조기 수령 60세부터</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">최대 5년 일찍 청구</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">5년 일찍이면 70% (1년에 6%씩 줄어요)</text>
<text x="80" y="338" font-size="26" fill="#1d1b19">줄어든 비율은 평생 그대로</text>
<rect x="40" y="396" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="396" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="450" font-size="30" font-weight="800" fill="#1d1b19">정상 수령 65세부터</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">가입기간 10년 이상이면 평생 받아요</text>
<rect x="40" y="554" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="554" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="608" font-size="30" font-weight="800" fill="#1d1b19">연기 수령 최대 70세까지</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">1년에 7.2%씩 더해져요</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">5년 늦추면 +36% (연기한 부분)</text>
</svg>
