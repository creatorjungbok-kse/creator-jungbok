<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 840" width="800" height="840" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>실손24 참여병원 확인 후 청구 방법</title>
<rect width="800" height="840" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">내 병원, 실손24 참여했나요?</text>
<text x="40" y="114" font-size="25" fill="#615e5a">실손24·네이버 지도에서 병원 이름을 검색해 확인해요</text>
<rect x="200" y="150" width="400" height="80" rx="40" fill="#f4b400"/>
<text x="400" y="200" font-size="30" font-weight="800" fill="#1d1b19" text-anchor="middle">참여병원 검색</text>
<line x1="400" y1="230" x2="400" y2="270" stroke="#1d1b19" stroke-width="4"/>
<line x1="210" y1="270" x2="590" y2="270" stroke="#1d1b19" stroke-width="4"/>
<line x1="210" y1="270" x2="210" y2="310" stroke="#1d1b19" stroke-width="4"/>
<line x1="590" y1="270" x2="590" y2="310" stroke="#1d1b19" stroke-width="4"/>
<rect x="35" y="310" width="350" height="500" rx="18" fill="#e6f4ea"/>
<text x="210" y="362" font-size="30" font-weight="800" fill="#1d1b19" text-anchor="middle">참여했어요</text>
<circle cx="75" cy="420" r="20" fill="#1d1b19"/><text x="75" y="429" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="107" y="430" font-size="25" font-weight="800" fill="#1d1b19">실손24로 청구</text>
<text x="107" y="466" font-size="22" fill="#615e5a">앱·홈페이지·네이버·토스</text>
<circle cx="75" cy="560" r="20" fill="#1d1b19"/><text x="75" y="569" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="107" y="570" font-size="25" font-weight="800" fill="#1d1b19">서류 발급 없음</text>
<text x="107" y="606" font-size="22" fill="#615e5a">영수증·세부내역서·</text>
<text x="107" y="638" font-size="22" fill="#615e5a">처방전은 병원이 보내요</text>
<circle cx="75" cy="700" r="20" fill="#1d1b19"/><text x="75" y="709" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="107" y="710" font-size="25" font-weight="800" fill="#1d1b19">진단서만 사진 첨부</text>
<text x="107" y="746" font-size="22" fill="#615e5a">입원 진단서 등이</text>
<text x="107" y="778" font-size="22" fill="#615e5a">필요할 때만</text>
<rect x="415" y="310" width="350" height="500" rx="18" fill="#fff3d6"/>
<text x="590" y="362" font-size="30" font-weight="800" fill="#1d1b19" text-anchor="middle">아직 안 했어요</text>
<circle cx="455" cy="420" r="20" fill="#1d1b19"/><text x="455" y="429" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="487" y="430" font-size="25" font-weight="800" fill="#1d1b19">서류를 떼요</text>
<text x="487" y="466" font-size="22" fill="#615e5a">진료비 영수증과</text>
<text x="487" y="498" font-size="22" fill="#615e5a">진료비 세부내역서</text>
<circle cx="455" cy="560" r="20" fill="#1d1b19"/><text x="455" y="569" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="487" y="570" font-size="25" font-weight="800" fill="#1d1b19">사진으로 청구</text>
<text x="487" y="606" font-size="22" fill="#615e5a">보험사 앱, 또는</text>
<text x="487" y="638" font-size="22" fill="#615e5a">네이버페이·토스 사진 청구</text>
<circle cx="455" cy="700" r="20" fill="#1d1b19"/><text x="455" y="709" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="487" y="710" font-size="25" font-weight="800" fill="#1d1b19">참여 요청하기</text>
<text x="487" y="746" font-size="22" fill="#615e5a">실손24 앱·홈페이지에서</text>
<text x="487" y="778" font-size="22" fill="#615e5a">병원에 참여를 요청해요</text>
</svg>