<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 728" width="800" height="728" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>자격득실확인서와 자격확인서</title>
<rect width="800" height="728" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">자격득실확인서와 자격확인서</text>
<text x="40" y="114" font-size="25" fill="#615e5a">이름은 비슷하지만 보여 주는 게 달라요</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">자격득실확인서</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">자격을 얻은 날·잃은 날 이력</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">예전 직장 가입 기간을 보여 줄 때</text>
<rect x="40" y="352" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">자격확인서</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">지금의 건강보험 자격</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">현재 가입자·피부양자인지 보여 줄 때</text>
<rect x="40" y="554" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="554" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="608" font-size="30" font-weight="800" fill="#1d1b19">4대보험 가입확인서</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">건강·연금·고용·산재 가입 현황을 한 장으로</text>
</svg>
