<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>부가세 역산 흔한 실수 비교</title>
<rect width="800" height="640" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">합계 220,000원의 공급가액은?</text>
<rect x="40" y="110" width="720" height="240" rx="22" fill="#fff" stroke="#c0392b" stroke-width="5"/>
<text x="80" y="166" font-size="30" font-weight="800" fill="#c0392b">✕ 틀린 계산</text>
<text x="80" y="230" font-size="38" font-weight="700" fill="#1d1b19">220,000 − 10% = 198,000원</text>
<text x="80" y="300" font-size="26" fill="#615e5a">합계에서 10%를 빼면 숫자가 안 맞아요</text>
<rect x="40" y="370" width="720" height="240" rx="22" fill="#fff" stroke="#1e8449" stroke-width="5"/>
<text x="80" y="426" font-size="30" font-weight="800" fill="#1e8449">○ 맞는 계산</text>
<text x="80" y="490" font-size="38" font-weight="700" fill="#1d1b19">220,000 ÷ 1.1 = 200,000원</text>
<text x="80" y="560" font-size="26" fill="#615e5a">부가세는 공급가액의 10%예요</text>
</svg>
