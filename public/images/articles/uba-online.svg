<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 614" width="800" height="614" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>온라인으로 되는 것, 방문해야 하는 것</title>
<rect width="800" height="614" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">온라인으로 되는 것, 방문해야 하는 것</text>
<text x="40" y="114" font-size="25" fill="#615e5a">상용근로자 기준, 고용24 안내</text>
<rect x="40" y="150" width="720" height="222" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="222" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">온라인·모바일로 가능</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">구직 등록, 수급자격 신청자 온라인 교육</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">신청서 미리 제출(요건을 갖춘 경우)</text>
<text x="80" y="338" font-size="26" fill="#1d1b19">출석 차수가 아닌 실업인정</text>
<rect x="40" y="396" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="396" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="450" font-size="30" font-weight="800" fill="#1d1b19">고용센터 방문 필수</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">수급자격 인정 신청(신분증 지참)</text>
<text x="80" y="540" font-size="26" fill="#1d1b19">1차·4차·8차 같은 출석 차수 실업인정</text>
</svg>
