<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 974" width="800" height="974" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>출력 전에 꼭 확인할 것</title>
<rect width="800" height="974" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">출력 전에 꼭 확인할 것</text>
<text x="40" y="114" font-size="25" fill="#615e5a">출력은 신청 1건당 1번만 돼요</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">네 보험 각각의 처리 여부</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">일부 항목만 처리돼도 출력할 수 있어요</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">[출력가능]이나 접수번호를 눌러 확인</text>
<rect x="40" y="352" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">'-' 표시</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">자료가 안 온 기관은 '-', 직인도 없어요</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">미가입이 아니라 자료 미도착일 수 있어요</text>
<rect x="40" y="554" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="554" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="608" font-size="30" font-weight="800" fill="#1d1b19">90일 안에 1번</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">출력가능일부터 90일, 지나면 기간만료</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">90일은 서류 유효기간이 아니에요</text>
<rect x="40" y="756" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="756" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="810" font-size="30" font-weight="800" fill="#1d1b19">처리오류</text>
<text x="80" y="856" font-size="26" fill="#1d1b19">그 기관 자료를 확인할 수 없는 상태</text>
<text x="80" y="900" font-size="26" fill="#1d1b19">내역이 필요하면 다시 신청해요</text>
</svg>
