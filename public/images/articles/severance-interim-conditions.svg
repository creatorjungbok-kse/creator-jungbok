<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 772" width="800" height="772" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>퇴직금 중간정산 조건</title>
<rect width="800" height="772" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">퇴직금 중간정산 조건</text>
<text x="40" y="114" font-size="25" fill="#615e5a">세 가지가 모두 맞아야 해요</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">법정 사유</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">주택 구입, 전세금, 의료비, 개인회생 등</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">법이 정한 사유에 해당</text>
<rect x="40" y="352" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">근로자가 요구</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">회사가 일방적으로 정산하면</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">중간정산으로 보지 않아요</text>
<rect x="40" y="554" width="720" height="178" rx="22" fill="#f4b400" stroke="#1d1b19" stroke-width="0"/>
<text x="80" y="608" font-size="30" font-weight="800" fill="#1d1b19">회사가 승낙</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">사유가 있어도 회사가</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">반드시 승낙할 의무는 없어요</text>
</svg>
