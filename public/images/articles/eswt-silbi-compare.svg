<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 526" width="800" height="526" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>실비 되는 경우와 안 되는 경우</title>
<rect width="800" height="526" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">실비 되는 경우와 안 되는 경우</text>
<text x="40" y="114" font-size="25" fill="#615e5a">분쟁조정기준을 모두 충족해야 해요</text>
<rect x="40" y="150" width="350" height="336" rx="18" fill="#e6f4ea"/>
<text x="64" y="200" font-size="28" font-weight="800" fill="#1d1b19">실비 받을 수 있어요</text>
<circle cx="74" cy="253" r="7" fill="#1d1b19"/><text x="92" y="262" font-size="24" fill="#1d1b19">7개 부위 대상 질환</text>
<circle cx="74" cy="317" r="7" fill="#1d1b19"/><text x="92" y="326" font-size="24" fill="#1d1b19">주 1회 이내</text>
<circle cx="74" cy="381" r="7" fill="#1d1b19"/><text x="92" y="390" font-size="24" fill="#1d1b19">부위당 6회, 연 12회 안</text>
<circle cx="74" cy="445" r="7" fill="#1d1b19"/><text x="92" y="454" font-size="24" fill="#1d1b19">치료 목적 처방</text>
<rect x="410" y="150" width="350" height="336" rx="18" fill="#fff3d6"/>
<text x="434" y="200" font-size="28" font-weight="800" fill="#1d1b19">실비 받기 어려워요</text>
<circle cx="444" cy="253" r="7" fill="#1d1b19"/><text x="462" y="262" font-size="24" fill="#1d1b19">대상 질환이 아님</text>
<circle cx="444" cy="317" r="7" fill="#1d1b19"/><text x="462" y="326" font-size="24" fill="#1d1b19">같은 날 둘째 부위</text>
<circle cx="444" cy="381" r="7" fill="#1d1b19"/><text x="462" y="390" font-size="24" fill="#1d1b19">기준 횟수를 넘긴 치료</text>
<circle cx="444" cy="445" r="7" fill="#1d1b19"/><text x="462" y="454" font-size="24" fill="#1d1b19">5세대 비중증 특약</text>
</svg>