<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 728" width="800" height="728" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>문화누리카드 받을 수 있는 사람</title>
<rect width="800" height="728" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">문화누리카드 받을 수 있는 사람</text>
<text x="40" y="114" font-size="25" fill="#615e5a">두 가지를 모두 갖춰야 해요</text>
<rect x="40" y="150" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">나이: 6세 이상</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">2020년 12월 31일 이전 출생</text>
<rect x="40" y="308" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="308" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="362" font-size="30" font-weight="800" fill="#1d1b19">자격: 수급자 또는 차상위</text>
<text x="80" y="408" font-size="26" fill="#1d1b19">기초생활수급자</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">차상위계층</text>
<rect x="40" y="510" width="720" height="178" rx="22" fill="#f4b400" stroke="#1d1b19" stroke-width="0"/>
<text x="80" y="564" font-size="30" font-weight="800" fill="#1d1b19">소득이 적은 것만으론 안 돼요</text>
<text x="80" y="610" font-size="26" fill="#1d1b19">수급자나 차상위 자격이 있어야 해요</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">6세 미만은 받을 수 없어요</text>
</svg>
