<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 798" width="800" height="798" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>고용24에서 찾는 메뉴 모음</title>
<rect width="800" height="798" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">고용24에서 찾는 메뉴 모음</text>
<text x="40" y="114" font-size="25" fill="#615e5a">로그인 후 마이페이지 &gt; 훈련관리</text>
<rect x="40" y="150" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">남은 지원금(잔액) 보기</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">국민내일배움카드 &gt; 카드사용내역</text>
<rect x="40" y="308" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="308" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="362" font-size="30" font-weight="800" fill="#1d1b19">훈련장려금·출석 보기</text>
<text x="80" y="408" font-size="26" fill="#1d1b19">직업훈련이력 &gt; 정산현황</text>
<rect x="40" y="466" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="466" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="520" font-size="30" font-weight="800" fill="#1d1b19">수강포기·만족도 작성</text>
<text x="80" y="566" font-size="26" fill="#1d1b19">직업훈련이력 &gt; 수강포기 / 만족도</text>
<rect x="40" y="624" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="624" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="678" font-size="30" font-weight="800" fill="#1d1b19">카드 발급확인서 출력</text>
<text x="80" y="724" font-size="26" fill="#1d1b19">국민내일배움카드 &gt; 발급확인서</text>
</svg>
