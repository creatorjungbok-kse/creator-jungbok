<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 816" width="800" height="816" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>온라인에서 되는 곳과 안 되는 곳</title>
<rect width="800" height="816" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">온라인에서 되는 곳과 안 되는 곳</text>
<text x="40" y="114" font-size="25" fill="#615e5a">결제 전에 누리집에서 한 번 더 검색해요</text>
<rect x="40" y="150" width="720" height="222" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="222" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">결제되는 곳</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">누리집 온라인 가맹점에서 검색되는 곳</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">예: 교보문고, YES24 도서, 알라딘,</text>
<text x="80" y="338" font-size="26" fill="#1d1b19">영풍문고 온라인(10월 27일 검색 기준)</text>
<rect x="40" y="396" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="396" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="450" font-size="30" font-weight="800" fill="#1d1b19">결제 안 되는 곳</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">쿠팡, G마켓, 옥션 같은 오픈마켓</text>
<text x="80" y="540" font-size="26" fill="#1d1b19">문구는 가맹점 화방·문구 쇼핑몰에서만</text>
<rect x="40" y="598" width="720" height="178" rx="22" fill="#f4b400" stroke="#1d1b19" stroke-width="0"/>
<text x="80" y="652" font-size="30" font-weight="800" fill="#1d1b19">온라인 주의</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">다른 카드와 나눠 내는 복합결제 불가</text>
<text x="80" y="742" font-size="26" fill="#1d1b19">잔액 안에서만 결제할 수 있어요</text>
</svg>
