<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>2026년 문화누리카드 연말 일정</title>
<rect width="1200" height="520" fill="#fdfaf2"/>
<text x="60" y="78" font-size="40" font-weight="800" fill="#1d1b19">2026년 문화누리카드 연말 일정</text>
<line x1="120" y1="230" x2="1080" y2="230" stroke="#1d1b19" stroke-width="6"/>
<g stroke="#1d1b19" stroke-width="5">
<circle cx="200" cy="230" r="26" fill="#f4b400"/><circle cx="600" cy="230" r="26" fill="#fff"/><circle cx="1000" cy="230" r="26" fill="#e0574f"/>
</g>
<g fill="#1d1b19" text-anchor="middle">
<text x="200" y="170" font-size="34" font-weight="800">11월 30일(월) 18시</text>
<text x="600" y="170" font-size="34" font-weight="800">12월 15일(화)</text>
<text x="1000" y="170" font-size="34" font-weight="800">12월 31일(목) 23:59</text>
<text x="200" y="306" font-size="26" font-weight="700">신규발급·재충전 마감</text>
<text x="200" y="346" font-size="22">주민센터·온라인 같음</text>
<text x="200" y="380" font-size="22">자동재충전 대상이 아니면</text>
<text x="200" y="412" font-size="22">이날까지 신청</text>
<text x="600" y="306" font-size="26" font-weight="700">온라인·앱 재발급</text>
<text x="600" y="346" font-size="22">올해 지원금을 쓰려면</text>
<text x="600" y="380" font-size="22">23시 59분까지 신청</text>
<text x="600" y="412" font-size="22">(9463-17 충전 카드는 온라인만)</text>
<text x="1000" y="306" font-size="26" font-weight="700">사용 마감</text>
<text x="1000" y="346" font-size="22">남은 지원금은 국고 반납</text>
<text x="1000" y="380" font-size="22">당일 취소가 아니면 환불에</text>
<text x="1000" y="412" font-size="22">영업일 3일에서 10일 걸릴 수 있음</text>
</g>
<text x="60" y="484" font-size="20" fill="#615e5a">본인이 넣은 충전금은 반납되지 않고 카드 유효기간까지 쓸 수 있습니다.</text>
</svg>
