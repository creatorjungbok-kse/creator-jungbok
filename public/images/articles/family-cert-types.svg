<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 772" width="800" height="772" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>일반·상세·특정 차이</title>
<rect width="800" height="772" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">일반·상세·특정 차이</text>
<text x="40" y="114" font-size="25" fill="#615e5a">따로 말이 없으면 일반이에요</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">일반</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">본인·부모·배우자·살아 있는 현재 혼인 중의 자녀</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">대부분의 제출처</text>
<rect x="40" y="352" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">상세</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">일반 + 모든 자녀(사망·혼인 외·이전 혼인)</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">상속, 새어머니·새아버지 관계</text>
<rect x="40" y="554" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="554" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="608" font-size="30" font-weight="800" fill="#1d1b19">특정</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">본인 + 고른 가족만</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">필요한 사람만 보여 주고 싶을 때</text>
</svg>
