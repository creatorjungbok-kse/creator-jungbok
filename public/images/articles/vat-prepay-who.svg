<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 974" width="800" height="974" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>부가세 예정고지 대상자</title>
<rect width="800" height="974" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">부가세 예정고지 대상자</text>
<text x="40" y="114" font-size="25" fill="#615e5a">고지할 금액이 50만원 미만이면 고지하지 않아요</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">개인 일반과세자</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">예정고지를 받아요</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">고지할 금액 50만원 이상일 때</text>
<rect x="40" y="352" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">소규모 법인</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">직전 과세기간 공급가액 1억5천만원 미만</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">예정고지를 받아요(50만원 이상일 때)</text>
<rect x="40" y="554" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="554" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="608" font-size="30" font-weight="800" fill="#1d1b19">그 밖의 법인</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">예정고지 없이 직접 예정신고해요</text>
<rect x="40" y="712" width="720" height="222" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="712" width="14" height="222" rx="7" fill="#f4b400"/>
<text x="80" y="766" font-size="30" font-weight="800" fill="#1d1b19">간이과세자</text>
<text x="80" y="812" font-size="26" fill="#1d1b19">예정고지는 없어요</text>
<text x="80" y="856" font-size="26" fill="#1d1b19">대신 7월에 예정부과 세액을 내요</text>
<text x="80" y="900" font-size="26" fill="#1d1b19">50만원 미만이면 예정부과도 없어요</text>
</svg>
