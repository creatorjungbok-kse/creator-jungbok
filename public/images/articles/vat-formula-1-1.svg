<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 760" width="800" height="760" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>부가세 1.1 계산 공식 세 가지</title>
<rect width="800" height="760" fill="#fdfaf2"/>
<text x="40" y="72" font-size="40" font-weight="800" fill="#1d1b19">부가세는 1.1만 기억하세요</text>
<text x="40" y="114" font-size="25" fill="#615e5a">공급가액 200,000원 · 합계 220,000원 기준</text>
<g font-weight="800" fill="#1d1b19">
<rect x="40" y="150" width="720" height="180" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="180" rx="7" fill="#f4b400"/>
<text x="80" y="200" font-size="28">① 부가세를 더할 때</text>
<text x="80" y="256" font-size="36" font-weight="700">공급가액 × 1.1 = 합계</text>
<text x="80" y="304" font-size="30" fill="#a87700">200,000원 → 220,000원</text>
<rect x="40" y="350" width="720" height="180" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="350" width="14" height="180" rx="7" fill="#f4b400"/>
<text x="80" y="400" font-size="28">② 부가세를 뺄 때(역산)</text>
<text x="80" y="456" font-size="36" font-weight="700">합계 ÷ 1.1 = 공급가액</text>
<text x="80" y="504" font-size="30" fill="#a87700">220,000원 → 200,000원</text>
<rect x="40" y="550" width="720" height="180" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="550" width="14" height="180" rx="7" fill="#f4b400"/>
<text x="80" y="600" font-size="28">③ 부가세만 알고 싶을 때</text>
<text x="80" y="656" font-size="36" font-weight="700">합계 ÷ 11 = 부가세</text>
<text x="80" y="704" font-size="30" fill="#a87700">220,000원 → 20,000원</text>
</g>
</svg>
