<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 526" width="800" height="526" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>실손24 자동 입력과 직접 입력</title>
<rect width="800" height="526" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">실손24 자동 입력과 직접 입력</text>
<text x="40" y="114" font-size="25" fill="#615e5a">내가 챙길 건 오른쪽뿐이에요</text>
<rect x="40" y="150" width="350" height="336" rx="18" fill="#e6f4ea"/>
<text x="64" y="200" font-size="28" font-weight="800" fill="#1d1b19">자동으로 넘어가요</text>
<circle cx="74" cy="253" r="7" fill="#1d1b19"/><text x="92" y="262" font-size="24" fill="#1d1b19">가입한 보험계약</text>
<circle cx="74" cy="317" r="7" fill="#1d1b19"/><text x="92" y="326" font-size="24" fill="#1d1b19">진료비 영수증</text>
<circle cx="74" cy="381" r="7" fill="#1d1b19"/><text x="92" y="390" font-size="24" fill="#1d1b19">진료비 세부산정내역서</text>
<circle cx="74" cy="445" r="7" fill="#1d1b19"/><text x="92" y="454" font-size="24" fill="#1d1b19">처방전</text>
<rect x="410" y="150" width="350" height="336" rx="18" fill="#fff3d6"/>
<text x="434" y="200" font-size="28" font-weight="800" fill="#1d1b19">내가 직접 해요</text>
<circle cx="444" cy="253" r="7" fill="#1d1b19"/><text x="462" y="262" font-size="24" fill="#1d1b19">질병인지 상해인지</text>
<circle cx="444" cy="317" r="7" fill="#1d1b19"/><text x="462" y="326" font-size="24" fill="#1d1b19">처음 받은 진료인지</text>
<circle cx="444" cy="381" r="7" fill="#1d1b19"/><text x="462" y="390" font-size="24" fill="#1d1b19">보험금 받을 계좌</text>
<circle cx="444" cy="445" r="7" fill="#1d1b19"/><text x="462" y="454" font-size="24" fill="#1d1b19">진단서 사진(필요할 때)</text>
</svg>