<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 974" width="800" height="974" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>육아휴직급여 구간별 지급 기준</title>
<rect width="800" height="974" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">육아휴직급여 구간별 지급 기준</text>
<text x="40" y="114" font-size="25" fill="#615e5a">2026년 기준, 월 통상임금으로 계산</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">처음 3개월</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">통상임금의 100%</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">상한 250만원 (한부모는 300만원)</text>
<rect x="40" y="352" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">4개월째부터 6개월째</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">통상임금의 100%</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">상한 200만원</text>
<rect x="40" y="554" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="554" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="608" font-size="30" font-weight="800" fill="#1d1b19">7개월째부터</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">통상임금의 80%</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">상한 160만원</text>
<rect x="40" y="756" width="720" height="178" rx="22" fill="#f4b400" stroke="#1d1b19" stroke-width="0"/>
<text x="80" y="810" font-size="30" font-weight="800" fill="#1d1b19">모든 구간 공통</text>
<text x="80" y="856" font-size="26" fill="#1d1b19">한 달 하한 70만원</text>
<text x="80" y="900" font-size="26" fill="#1d1b19">휴직 중에 전액 지급</text>
</svg>
