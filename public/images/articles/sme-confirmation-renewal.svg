<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 728" width="800" height="728" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>유효기간과 갱신 시기</title>
<rect width="800" height="728" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">유효기간과 갱신 시기</text>
<text x="40" y="114" font-size="25" fill="#615e5a">12월 결산 기업 기준</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">유효기간</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">4월 1일부터 다음 해 3월 31일까지</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">2026년 확인서는 2027년 3월 31일까지</text>
<rect x="40" y="352" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">갱신 신청</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">직전 사업연도 말일에서 3개월이 지난 날부터</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">12월 결산이면 4월 1일부터 새로 신청</text>
<rect x="40" y="554" width="720" height="134" rx="22" fill="#f4b400" stroke="#1d1b19" stroke-width="0"/>
<text x="80" y="608" font-size="30" font-weight="800" fill="#1d1b19">주의</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">3월에 받은 확인서는 3월 31일에 끝나요</text>
</svg>
