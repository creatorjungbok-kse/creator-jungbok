<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 526" width="800" height="526" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>실비 되는 도수치료와 안 되는 도수치료</title>
<rect width="800" height="526" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">실비 되는 도수치료와 안 되는 도수치료</text>
<text x="40" y="114" font-size="25" fill="#615e5a">관리급여 기준을 지켜야 실비가 나와요</text>
<rect x="40" y="150" width="350" height="336" rx="18" fill="#e6f4ea"/>
<text x="64" y="200" font-size="28" font-weight="800" fill="#1d1b19">실비 받을 수 있어요</text>
<circle cx="74" cy="253" r="7" fill="#1d1b19"/><text x="92" y="262" font-size="24" fill="#1d1b19">의사가 치료 목적 처방</text>
<circle cx="74" cy="317" r="7" fill="#1d1b19"/><text x="92" y="326" font-size="24" fill="#1d1b19">선행치료 2주·4회 뒤</text>
<circle cx="74" cy="381" r="7" fill="#1d1b19"/><text x="92" y="390" font-size="24" fill="#1d1b19">주 2회 이내</text>
<circle cx="74" cy="445" r="7" fill="#1d1b19"/><text x="92" y="454" font-size="24" fill="#1d1b19">연 15회 안(최대 24회)</text>
<rect x="410" y="150" width="350" height="336" rx="18" fill="#fff3d6"/>
<text x="434" y="200" font-size="28" font-weight="800" fill="#1d1b19">실비 안 나와요</text>
<circle cx="444" cy="253" r="7" fill="#1d1b19"/><text x="462" y="262" font-size="24" fill="#1d1b19">피로회복·체형교정</text>
<circle cx="444" cy="317" r="7" fill="#1d1b19"/><text x="462" y="326" font-size="24" fill="#1d1b19">인정 횟수를 넘긴 치료</text>
<circle cx="444" cy="381" r="7" fill="#1d1b19"/><text x="462" y="390" font-size="24" fill="#1d1b19">선행치료 기록이 없음</text>
<circle cx="444" cy="445" r="7" fill="#1d1b19"/><text x="462" y="454" font-size="24" fill="#1d1b19">5세대 외래(환급 약 2천원)</text>
</svg>