<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 772" width="800" height="772" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>추계액 신고할 수 있는 조건</title>
<rect width="800" height="772" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">추계액 신고할 수 있는 조건</text>
<text x="40" y="114" font-size="25" fill="#615e5a">고지세액이 아니라 중간예납기준액이 기준이에요</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">조건</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">중간예납추계액이</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">중간예납기준액의 30%에 못 미칠 때</text>
<rect x="40" y="352" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">헷갈리기 쉬운 것</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">고지세액의 30%가 아니에요</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">매출 감소율 30%도 아니에요</text>
<rect x="40" y="554" width="720" height="178" rx="22" fill="#f4b400" stroke="#1d1b19" stroke-width="0"/>
<text x="80" y="608" font-size="30" font-weight="800" fill="#1d1b19">예시</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">기준액 300만원(고지세액 150만원)이면</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">추계액 90만원 미만일 때 신고 가능</text>
</svg>
