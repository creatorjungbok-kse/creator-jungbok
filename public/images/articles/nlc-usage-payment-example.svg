<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 728" width="800" height="728" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>카드로 결제하면 이렇게 나뉘어요</title>
<rect width="800" height="728" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">카드로 결제하면 이렇게 나뉘어요</text>
<text x="40" y="114" font-size="25" fill="#615e5a">고용24 목록에 나온 AI 입문 과정 예시(10월 28일)</text>
<rect x="40" y="150" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">훈련비</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">198,600원(10일, 총 30시간)</text>
<rect x="40" y="308" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="308" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="362" font-size="30" font-weight="800" fill="#1d1b19">내가 내는 돈(본인부담액)</text>
<text x="80" y="408" font-size="26" fill="#1d1b19">49,650원</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">내일배움카드로 결제해요</text>
<rect x="40" y="510" width="720" height="178" rx="22" fill="#f4b400" stroke="#1d1b19" stroke-width="0"/>
<text x="80" y="564" font-size="30" font-weight="800" fill="#1d1b19">지원 한도에서 빠지는 돈</text>
<text x="80" y="610" font-size="26" fill="#1d1b19">198,600원 - 49,650원 = 148,950원</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">300만원 한도에서 차감돼요</text>
</svg>
