<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 820" width="800" height="820" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>일반과세자 납부세액 계산 흐름</title>
<rect width="800" height="820" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">일반과세자가 내는 부가세</text>
<text x="40" y="114" font-size="25" fill="#615e5a">예시: 매출 1,000만원 · 매입 300만원</text>
<rect x="40" y="150" width="720" height="160" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<text x="80" y="210" font-size="32" font-weight="800" fill="#1d1b19">매출세액</text>
<text x="80" y="260" font-size="25" fill="#615e5a">매출 공급가액 × 10%</text>
<text x="720" y="245" font-size="40" font-weight="800" fill="#1d1b19" text-anchor="end">100만원</text>
<text x="400" y="372" font-size="60" font-weight="800" fill="#1d1b19" text-anchor="middle">−</text>
<rect x="40" y="400" width="720" height="160" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<text x="80" y="460" font-size="32" font-weight="800" fill="#1d1b19">매입세액</text>
<text x="80" y="510" font-size="25" fill="#615e5a">세금계산서 등으로 받은 부가세</text>
<text x="720" y="495" font-size="40" font-weight="800" fill="#1d1b19" text-anchor="end">30만원</text>
<text x="400" y="622" font-size="60" font-weight="800" fill="#1d1b19" text-anchor="middle">=</text>
<rect x="40" y="650" width="720" height="140" rx="22" fill="#f4b400"/>
<text x="80" y="735" font-size="34" font-weight="800" fill="#1d1b19">낼 부가세(납부세액)</text>
<text x="720" y="737" font-size="44" font-weight="800" fill="#1d1b19" text-anchor="end">70만원</text>
</svg>
