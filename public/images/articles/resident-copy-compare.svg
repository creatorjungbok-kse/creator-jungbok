<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 860" width="800" height="860" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>등본과 초본 차이</title>
<rect width="800" height="860" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">등본과 초본 차이</text>
<text x="40" y="114" font-size="25" fill="#615e5a">제출처가 확인하려는 내용에 맞춰 골라요</text>
<rect x="40" y="150" width="720" height="222" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="222" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">등본(세대별 주민등록표)</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">한 세대의 모든 구성원이 나와요</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">세대원 이름, 세대주와의 관계</text>
<text x="80" y="338" font-size="26" fill="#1d1b19">동거인도 넣을 수 있어요</text>
<rect x="40" y="396" width="720" height="222" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="396" width="14" height="222" rx="7" fill="#f4b400"/>
<text x="80" y="450" font-size="30" font-weight="800" fill="#1d1b19">초본(한 사람에 관한 기록)</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">한 사람의 상세한 주민등록 사항</text>
<text x="80" y="540" font-size="26" fill="#1d1b19">과거 주소 변동 사항(주소 이력)</text>
<text x="80" y="584" font-size="26" fill="#1d1b19">병역 사항(기본 또는 전체)</text>
<rect x="40" y="642" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="642" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="696" font-size="30" font-weight="800" fill="#1d1b19">따로 사는 가족과의 관계</text>
<text x="80" y="742" font-size="26" fill="#1d1b19">등본이 아니라 가족관계증명서로</text>
<text x="80" y="786" font-size="26" fill="#1d1b19">확인해요(전자가족관계등록시스템)</text>
</svg>
