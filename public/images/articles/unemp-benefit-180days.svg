<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 904" width="800" height="904" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>180일에 들어가는 날 빠지는 날</title>
<rect width="800" height="904" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">180일에 들어가는 날 빠지는 날</text>
<text x="40" y="114" font-size="25" fill="#615e5a">달력 날짜가 아니라 보수 지급의 기초가 된 날</text>
<rect x="40" y="150" width="720" height="266" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="266" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">들어가는 날</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">실제로 일한 날</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">유급 주휴일, 약정 유급휴일</text>
<text x="80" y="338" font-size="26" fill="#1d1b19">평균임금 70% 이상 휴업수당 받은 기간</text>
<text x="80" y="382" font-size="26" fill="#1d1b19">회사에서 돈을 받은 유급휴가 기간</text>
<rect x="40" y="440" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="440" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="494" font-size="30" font-weight="800" fill="#1d1b19">빠지는 날</text>
<text x="80" y="540" font-size="26" fill="#1d1b19">무급 휴일</text>
<text x="80" y="584" font-size="26" fill="#1d1b19">(주 5일 근무의 무급 토요일 등)</text>
<rect x="40" y="642" width="720" height="222" rx="22" fill="#f4b400" stroke="#1d1b19" stroke-width="0"/>
<text x="80" y="696" font-size="30" font-weight="800" fill="#1d1b19">예시: 2024년 1월 한 달</text>
<text x="80" y="742" font-size="26" fill="#1d1b19">근무 22일 + 주휴일 4일 + 신정 1일</text>
<text x="80" y="786" font-size="26" fill="#1d1b19">= 26일로 계산</text>
<text x="80" y="830" font-size="26" fill="#1d1b19">6개월 근무만으로는 보통 180일 부족</text>
</svg>
