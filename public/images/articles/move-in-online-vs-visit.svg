<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 658" width="800" height="658" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>인터넷과 주민센터 방문 비교</title>
<rect width="800" height="658" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">인터넷과 주민센터 방문 비교</text>
<text x="40" y="114" font-size="25" fill="#615e5a">나에게 맞는 신고 방법 고르기</text>
<rect x="40" y="150" width="720" height="222" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="222" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">정부24 인터넷</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">본인만 신청, 수수료 없음</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">근무시간에 신청하면 3시간 안에 처리</text>
<text x="80" y="338" font-size="26" fill="#1d1b19">세대주 확인이 필요하면 8일 안에</text>
<rect x="40" y="396" width="720" height="222" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="396" width="14" height="222" rx="7" fill="#f4b400"/>
<text x="80" y="450" font-size="30" font-weight="800" fill="#1d1b19">주민센터 방문</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">신분증, 행정정보 공동이용 동의서</text>
<text x="80" y="540" font-size="26" fill="#1d1b19">대리인은 위임장, 두 사람 신분증</text>
<text x="80" y="584" font-size="26" fill="#1d1b19">해외 체류 후 입국·재외국민은 방문</text>
</svg>
