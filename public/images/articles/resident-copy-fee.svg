<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 772" width="800" height="772" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>발급 방법별 수수료(1통)</title>
<rect width="800" height="772" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">발급 방법별 수수료(1통)</text>
<text x="40" y="114" font-size="25" fill="#615e5a">본인·세대원이 정부24로 신청하면 무료예요</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">정부24(인터넷)</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">무료</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">본인·세대원만, 대리 신청 불가</text>
<rect x="40" y="352" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">무인민원발급기</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">200원</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">방문 수수료의 절반</text>
<rect x="40" y="554" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="554" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="608" font-size="30" font-weight="800" fill="#1d1b19">주민센터·구청 등 방문</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">400원</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">신분증 필요, 대리인은 위임장</text>
</svg>
