<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 772" width="800" height="772" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>어디서 무엇을 확인할까</title>
<rect width="800" height="772" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">어디서 무엇을 확인할까</text>
<text x="40" y="114" font-size="25" fill="#615e5a">목적에 맞는 곳을 골라요</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">홈택스 사업자상태 조회</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">휴업·폐업 여부, 과세유형</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">공식 정보 · 거래 전 최종 확인</text>
<rect x="40" y="352" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">비즈노·더비즈 같은 민간 사이트</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">상호·주소·전화번호 참고</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">공공 자료를 다시 가공한 참고용</text>
<rect x="40" y="554" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="554" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="608" font-size="30" font-weight="800" fill="#1d1b19">공정위 통신판매사업자 조회</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">온라인 판매자의 상호·대표자</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">통신판매업 신고자만 나와요</text>
</svg>
