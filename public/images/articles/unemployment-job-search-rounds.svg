<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>실업급여 구직활동 차수별 기준</title>
<rect width="1200" height="900" fill="#fdfaf2"/>
<text x="60" y="78" font-size="40" font-weight="800" fill="#1d1b19">실업급여 구직활동, 차수마다 이만큼</text>
<text x="60" y="120" font-size="25" fill="#615e5a">일반 수급자 기준 · 재취업활동 = 구직활동(입사지원·면접) + 구직외활동(특강·검사 등)</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d1b19"/></marker></defs>
<g stroke="#1d1b19" stroke-width="4">
<rect x="60" y="150" width="1080" height="120" rx="16" fill="#fff"/>
<rect x="60" y="300" width="1080" height="120" rx="16" fill="#fff"/>
<rect x="60" y="450" width="1080" height="120" rx="16" fill="#f4b400"/>
<rect x="60" y="600" width="1080" height="120" rx="16" fill="#fff"/>
</g>
<g stroke="#1d1b19" stroke-width="4" fill="none" marker-end="url(#a)">
<path d="M150 270V296"/><path d="M150 420V446"/><path d="M150 570V596"/>
</g>
<g font-size="29" font-weight="800" fill="#1d1b19">
<text x="92" y="200">1차 · 고용센터 출석</text>
<text x="92" y="350">2차 · 3차 · 온라인 또는 출석</text>
<text x="92" y="500">4차부터 · 4차는 꼭 출석</text>
<text x="92" y="650">8차부터 · 8차는 꼭 출석(210일 이상 받는 사람)</text>
</g>
<g font-size="23" fill="#3d3a36">
<text x="92" y="244">집체교육 이수 · 이번엔 따로 낼 활동 없음</text>
<text x="92" y="394">4주에 1회 · 구직외활동(취업특강 등)도 가능</text>
<text x="92" y="544" fill="#1d1b19">4주에 2회 · 그중 구직활동(입사지원·면접) 1회는 꼭</text>
<text x="92" y="694">1주에 1회 · 구직활동만 인정</text>
</g>
<text x="60" y="780" font-size="22" fill="#3d3a36">60세 이상·장애인: 꼭 출석은 4차(1차는 센터 확인), 4주에 1회 이상, 구직외활동도 선택 가능</text>
<text x="60" y="816" font-size="22" fill="#3d3a36">반복 수급자: 2주에 1회(4차부터 4주에 2회), 3차부터 구직활동만 · 내 기준은 수급자격증·담당자 안내가 우선</text>
<text x="60" y="864" font-size="19" fill="#615e5a">근거: 고용노동부 고객상담센터 상담 안내(2026년 6월·10월 답변), 실업인정 및 재취업지원규정(2026.9.1 개정)</text>
</svg>
