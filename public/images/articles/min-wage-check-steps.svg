<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>최저임금 미달 확인 3단계</title>
<rect width="800" height="620" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">최저임금 미달 확인 3단계</text>
<text x="40" y="114" font-size="25" fill="#615e5a">내 월급이 최저임금 이상인지 보는 순서</text>
<circle cx="80" cy="200" r="32" fill="#f4b400"/><text x="80" y="212" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">1</text>
<text x="135" y="194" font-size="29" font-weight="800" fill="#1d1b19">들어가는 돈만 더하기</text>
<text x="135" y="236" font-size="24" fill="#615e5a">기본급·주휴수당·매달 주는 상여금 등</text>
<line x1="80" y1="234" x2="80" y2="316" stroke="#1d1b19" stroke-width="4"/>
<circle cx="80" cy="350" r="32" fill="#f4b400"/><text x="80" y="362" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">2</text>
<text x="135" y="344" font-size="29" font-weight="800" fill="#1d1b19">월 기준시간 찾기</text>
<text x="135" y="386" font-size="24" fill="#615e5a">주 40시간이면 209시간</text>
<line x1="80" y1="384" x2="80" y2="466" stroke="#1d1b19" stroke-width="4"/>
<circle cx="80" cy="500" r="32" fill="#f4b400"/><text x="80" y="512" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">3</text>
<text x="135" y="494" font-size="29" font-weight="800" fill="#1d1b19">나눈 시간급과 비교</text>
<text x="135" y="536" font-size="24" fill="#615e5a">2026년 10,320원, 2027년 10,700원</text>
</svg>
