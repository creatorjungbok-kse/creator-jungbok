<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 860" width="800" height="860" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>결근으로 보는 날과 아닌 날</title>
<rect width="800" height="860" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">결근으로 보는 날과 아닌 날</text>
<text x="40" y="114" font-size="25" fill="#615e5a">그 주 개근인지 가르는 기준이에요</text>
<rect x="40" y="150" width="720" height="222" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="222" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">결근으로 봐요</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">일하기로 한 날에 스스로 안 나온 날</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">그 주 주휴수당은 없어요</text>
<text x="80" y="338" font-size="26" fill="#1d1b19">다음 주는 다시 따져요</text>
<rect x="40" y="396" width="720" height="222" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="396" width="14" height="222" rx="7" fill="#f4b400"/>
<text x="80" y="450" font-size="30" font-weight="800" fill="#1d1b19">결근이 아니에요</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">지각·조퇴·휴가·휴일·휴업</text>
<text x="80" y="540" font-size="26" fill="#1d1b19">나머지 날을 나왔다면 개근이에요</text>
<text x="80" y="584" font-size="26" fill="#1d1b19">못 일한 시간의 임금은 깎일 수 있어요</text>
<rect x="40" y="642" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="642" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="696" font-size="30" font-weight="800" fill="#1d1b19">공휴일에 쉰 날(5인 이상)</text>
<text x="80" y="742" font-size="26" fill="#1d1b19">휴일이라 결근이 아니에요</text>
<text x="80" y="786" font-size="26" fill="#1d1b19">나머지 날을 개근하면 생겨요</text>
</svg>
