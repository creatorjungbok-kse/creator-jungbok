<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>퇴직금 IRP 받는 방법별 세금 비교</title>
<rect width="1200" height="760" fill="#fdfaf2"/>
<text x="60" y="78" font-size="40" font-weight="800" fill="#1d1b19">퇴직금 IRP, 어떻게 꺼내느냐에 따라 세금이 달라요</text>
<text x="60" y="120" font-size="25" fill="#615e5a">예시: 10년 근무, 퇴직금 5,000만원 전부를 각 방식으로 꺼낸다고 가정 (지방소득세 포함)</text>
<g font-size="26" font-weight="700" fill="#1d1b19">
<text x="60" y="222">일시금·IRP 해지</text>
<text x="60" y="342">연금 1년차부터 10년차</text>
<text x="60" y="462">연금 11년차부터 20년차</text>
<text x="60" y="582">연금 21년차부터</text>
</g>
<g font-size="21" fill="#615e5a">
<text x="60" y="254">퇴직소득세 100%</text>
<text x="60" y="374">30% 감면 (70%만 냄)</text>
<text x="60" y="494">40% 감면 (60%만 냄)</text>
<text x="60" y="614">50% 감면 (50%만 냄)</text>
</g>
<g stroke="#1d1b19" stroke-width="4">
<rect x="380" y="190" width="630" height="70" rx="10" fill="#e8833a"/>
<rect x="380" y="310" width="441" height="70" rx="10" fill="#f4b400"/>
<rect x="380" y="430" width="378" height="70" rx="10" fill="#9fcf8f"/>
<rect x="380" y="550" width="315" height="70" rx="10" fill="#2f9e83"/>
</g>
<g font-size="30" font-weight="800" fill="#1d1b19">
<text x="1026" y="236">748,000원</text>
<text x="837" y="356">523,600원</text>
<text x="774" y="476">448,800원</text>
<text x="711" y="596">374,000원</text>
</g>
<text x="60" y="690" font-size="22" fill="#3d3a36">연금은 55세 이후, 한 해 한도 안에서 꺼낼 때만 감면돼요. 한도를 넘거나 해지하면 일시금과 같은 세금입니다.</text>
<text x="60" y="728" font-size="19" fill="#615e5a">근거: 소득세법·같은 법 시행령(2026년 10월 기준), 국세청 퇴직소득세 계산방법 · 운용수익에 붙는 세금은 제외</text>
</svg>
