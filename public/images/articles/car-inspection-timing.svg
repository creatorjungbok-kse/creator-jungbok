<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 772" width="800" height="772" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>검사 시기별로 달라지는 것</title>
<rect width="800" height="772" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">검사 시기별로 달라지는 것</text>
<text x="40" y="114" font-size="25" fill="#615e5a">만료일 전 90일부터 후 31일까지가 검사기간</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">검사기간보다 먼저 받으면</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">다음 유효기간이 검사받은 날 다음 날부터</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">다음 검사일도 그만큼 앞당겨져요</text>
<rect x="40" y="352" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">검사기간이 지난 뒤 받으면</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">과태료가 붙어요(30일 이내 4만원)</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">다음 유효기간은 검사받은 날 다음 날부터</text>
<rect x="40" y="554" width="720" height="178" rx="22" fill="#f4b400" stroke="#1d1b19" stroke-width="0"/>
<text x="80" y="608" font-size="30" font-weight="800" fill="#1d1b19">검사기간 안에 합격하면</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">만료일에 검사받은 것으로 봐요</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">다음 유효기간은 만료일 다음 날부터</text>
</svg>
