<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 860" width="800" height="860" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>분야별 협력판매처와 한도</title>
<rect width="800" height="860" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">분야별 협력판매처와 한도</text>
<text x="40" y="114" font-size="25" fill="#615e5a">수도권(서울·경기·인천) / 비수도권</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">공연·전시</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">티켓링크, 멜론티켓, NOL 티켓, YES24 티켓</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">지원금 안에서 사용</text>
<rect x="40" y="352" width="720" height="222" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="222" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">영화</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">메가박스, CGV, 롯데시네마</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">수도권 2회, 비수도권 4회</text>
<text x="80" y="540" font-size="26" fill="#1d1b19">본인 티켓 1매만</text>
<rect x="40" y="598" width="720" height="222" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="598" width="14" height="222" rx="7" fill="#f4b400"/>
<text x="80" y="652" font-size="30" font-weight="800" fill="#1d1b19">도서</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">서점ON, YES24 도서</text>
<text x="80" y="742" font-size="26" fill="#1d1b19">수도권 5만원, 비수도권 7만원</text>
<text x="80" y="786" font-size="26" fill="#1d1b19">배송비 포함, 주문 1건에 1권</text>
