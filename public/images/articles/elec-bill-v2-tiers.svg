<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 904" width="800" height="904" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>주택용 저압 누진 구간</title>
<rect width="800" height="904" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">주택용 저압 누진 구간</text>
<text x="40" y="114" font-size="25" fill="#615e5a">한 달 사용량 기준 · 2023년 11월 9일 적용</text>
<rect x="40" y="150" width="720" height="222" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="222" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">1구간 · 기본요금 910원</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">그 외 기간: 200kWh까지</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">7월·8월: 300kWh까지</text>
<text x="80" y="338" font-size="26" fill="#1d1b19">전력량요금 kWh당 120.0원</text>
<rect x="40" y="396" width="720" height="222" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
