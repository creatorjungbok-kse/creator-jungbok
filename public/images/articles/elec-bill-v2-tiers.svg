<text x="80" y="450" font-size="30" font-weight="800" fill="#1d1b19">2구간 · 기본요금 1,600원</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">그 외 기간: 201kWh부터 400kWh까지</text>
<text x="80" y="540" font-size="26" fill="#1d1b19">7월·8월: 301kWh부터 450kWh까지</text>
<text x="80" y="584" font-size="26" fill="#1d1b19">전력량요금 kWh당 214.6원</text>
<rect x="40" y="642" width="720" height="222" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="642" width="14" height="222" rx="7" fill="#f4b400"/>
<text x="80" y="696" font-size="30" font-weight="800" fill="#1d1b19">3구간 · 기본요금 7,300원</text>
