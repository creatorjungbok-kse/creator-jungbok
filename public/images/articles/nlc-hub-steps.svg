<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 920" width="800" height="920" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>카드 신청부터 수료까지</title>
<rect width="800" height="920" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">카드 신청부터 수료까지</text>
<text x="40" y="114" font-size="25" fill="#615e5a">고용24 국민내일배움카드 안내 기준</text>
<circle cx="80" cy="200" r="32" fill="#f4b400"/><text x="80" y="212" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">1</text>
<text x="135" y="194" font-size="29" font-weight="800" fill="#1d1b19">구직 등록(실업자만)</text>
<text x="135" y="236" font-size="24" fill="#615e5a">실업급여·국민취업지원제도로 했다면 생략</text>
<line x1="80" y1="234" x2="80" y2="316" stroke="#1d1b19" stroke-width="4"/>
<circle cx="80" cy="350" r="32" fill="#f4b400"/><text x="80" y="362" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">2</text>
<text x="135" y="344" font-size="29" font-weight="800" fill="#1d1b19">카드 발급 신청</text>
<text x="135" y="386" font-size="24" fill="#615e5a">고용24 온라인 또는 거주지 관할 고용센터</text>
<line x1="80" y1="384" x2="80" y2="466" stroke="#1d1b19" stroke-width="4"/>
<circle cx="80" cy="500" r="32" fill="#f4b400"/><text x="80" y="512" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">3</text>
<text x="135" y="494" font-size="29" font-weight="800" fill="#1d1b19">심사와 카드 수령</text>
<text x="135" y="536" font-size="24" fill="#615e5a">접수일부터 7일 안에 결과, 우편이나 은행</text>
<line x1="80" y1="534" x2="80" y2="616" stroke="#1d1b19" stroke-width="4"/>
<circle cx="80" cy="650" r="32" fill="#f4b400"/><text x="80" y="662" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">4</text>
<text x="135" y="644" font-size="29" font-weight="800" fill="#1d1b19">과정 찾고 수강 신청</text>
<text x="135" y="686" font-size="24" fill="#615e5a">140시간 이상 과정은 훈련 진단·상담 먼저</text>
<line x1="80" y1="684" x2="80" y2="766" stroke="#1d1b19" stroke-width="4"/>
<circle cx="80" cy="800" r="32" fill="#f4b400"/><text x="80" y="812" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">5</text>
<text x="135" y="794" font-size="29" font-weight="800" fill="#1d1b19">수료 후 만족도 조사</text>
<text x="135" y="836" font-size="24" fill="#615e5a">30일 안에, 안 하면 마지막 달 장려금 없음</text>
</svg>
