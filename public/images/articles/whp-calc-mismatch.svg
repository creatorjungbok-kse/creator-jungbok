<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 816" width="800" height="816" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>다른 계산기와 금액이 다를 때</title>
<rect width="800" height="816" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">다른 계산기와 금액이 다를 때</text>
<text x="40" y="114" font-size="25" fill="#615e5a">공식보다 넣은 숫자를 먼저 비교해 보세요</text>
<rect x="40" y="150" width="720" height="222" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="222" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">1주 근로시간</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">실제 일한 시간이 아니라</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">근로계약서에 약속한 시간</text>
<text x="80" y="338" font-size="26" fill="#1d1b19">더 일한 시간은 빼요</text>
<rect x="40" y="396" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="396" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="450" font-size="30" font-weight="800" fill="#1d1b19">시급 기준 연도</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">2026년 10,320원인지</text>
<text x="80" y="540" font-size="26" fill="#1d1b19">2027년 10,700원인지 확인</text>
<rect x="40" y="598" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="598" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="652" font-size="30" font-weight="800" fill="#1d1b19">주휴 포함 시급 여부</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">주휴수당이 들어간 시급을 넣으면</text>
<text x="80" y="742" font-size="26" fill="#1d1b19">두 번 계산돼요</text>
</svg>
