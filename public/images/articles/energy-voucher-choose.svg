<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>요금차감과 국민행복카드 비교</title>
<rect width="800" height="700" fill="#fdfaf2"/>
<text x="40" y="72" font-size="40" font-weight="800" fill="#1d1b19">겨울엔 둘 중 하나를 골라요</text>
<rect x="40" y="110" width="720" height="260" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="110" width="14" height="260" rx="7" fill="#f4b400"/>
<text x="80" y="165" font-size="32" font-weight="800" fill="#1d1b19">요금차감</text>
<text x="80" y="210" font-size="26" fill="#1d1b19">고지서에서 자동으로 빠져요</text>
<text x="80" y="256" font-size="26" fill="#1d1b19">전기·도시가스·지역난방 중 1가지</text>
<text x="80" y="302" font-size="26" fill="#1d1b19">지역난방은 요금차감으로만</text>
<text x="80" y="346" font-size="24" fill="#615e5a">신청할 때 최근 고지서 필요</text>
<rect x="40" y="400" width="720" height="260" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="400" width="14" height="260" rx="7" fill="#f4b400"/>
<text x="80" y="455" font-size="32" font-weight="800" fill="#1d1b19">국민행복카드</text>
<text x="80" y="500" font-size="26" fill="#1d1b19">카드로 직접 결제해요</text>
<text x="80" y="546" font-size="26" fill="#1d1b19">전기·도시가스·등유·LPG·연탄</text>
<text x="80" y="592" font-size="26" fill="#1d1b19">등유·LPG·연탄은 카드로만</text>
<text x="80" y="636" font-size="24" fill="#615e5a">은행·카드사에서 카드 발급 필요</text>
</svg>
