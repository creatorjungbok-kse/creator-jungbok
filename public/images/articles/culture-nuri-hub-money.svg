<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 746" width="800" height="746" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>지원금과 본인충전금 차이</title>
<rect width="800" height="746" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">지원금과 본인충전금 차이</text>
<text x="40" y="114" font-size="25" fill="#615e5a">2026년 문화누리카드 기준</text>
<rect x="40" y="150" width="720" height="266" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="266" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">국가지원금</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">1인당 1년에 한 번만 충전</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">현금 인출·환불 불가</text>
<text x="80" y="338" font-size="26" fill="#1d1b19">12월 31일 23시 59분 지나면</text>
<text x="80" y="382" font-size="26" fill="#1d1b19">국고로 반납</text>
<rect x="40" y="440" width="720" height="266" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="440" width="14" height="266" rx="7" fill="#f4b400"/>
<text x="80" y="494" font-size="30" font-weight="800" fill="#1d1b19">본인충전금</text>
<text x="80" y="540" font-size="26" fill="#1d1b19">카드 앞면 가상계좌로 입금</text>
<text x="80" y="584" font-size="26" fill="#1d1b19">한 번에 100원 이상</text>
<text x="80" y="628" font-size="26" fill="#1d1b19">카드 유효기간까지 사용</text>
<text x="80" y="672" font-size="26" fill="#1d1b19">농협 통장이나 영업점으로 환불</text>
</svg>
