<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 570" width="800" height="570" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>적금 이자가 예금의 절반쯤인 이유</title>
<rect width="800" height="570" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">적금 이자가 예금의 절반쯤인 이유</text>
<text x="40" y="114" font-size="25" fill="#615e5a">연 3.5% · 1년 · 단리 · 원금 합계 600만원</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">예금 600만원</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">처음부터 12개월 내내 맡겨져요</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">세전 이자 210,000원</text>
<rect x="40" y="352" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">적금 월 50만원</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">첫 달 돈은 12개월, 마지막 달 돈은 1개월</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">세전 이자 113,750원</text>
</svg>
