<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 930" width="800" height="930" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>근속연수별 퇴직금 세금</title>
<rect width="800" height="930" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">근속연수별 퇴직금 세금</text>
<text x="40" y="114" font-size="25" fill="#615e5a">퇴직금 5,000만원, 지방소득세 포함 기준</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">3년 근무</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">세금 4,138,200원(8.3%)</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">세후 45,861,800원</text>
<rect x="40" y="352" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">5년 근무</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">세금 2,358,120원(4.7%)</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">세후 47,641,880원</text>
<rect x="40" y="554" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="554" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="608" font-size="30" font-weight="800" fill="#1d1b19">10년 근무</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">세금 748,000원(1.5%)</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">세후 49,252,000원</text>
<rect x="40" y="756" width="720" height="134" rx="22" fill="#f4b400" stroke="#1d1b19" stroke-width="0"/>
<text x="80" y="810" font-size="30" font-weight="800" fill="#1d1b19">20년 근무</text>
