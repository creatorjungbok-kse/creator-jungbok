<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 816" width="800" height="816" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>퇴직금 받는 조건 2가지</title>
<rect width="800" height="816" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">퇴직금 받는 조건 2가지</text>
<text x="40" y="114" font-size="25" fill="#615e5a">두 조건을 모두 채워야 해요</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">① 계속근로기간</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">1년 이상</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">수습·육아휴직·출산전후휴가 포함</text>
<rect x="40" y="352" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">② 근로시간</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">4주간 평균 1주 소정근로시간</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">15시간 이상</text>
<rect x="40" y="554" width="720" height="222" rx="22" fill="#f4b400" stroke="#1d1b19" stroke-width="0"/>
<text x="80" y="608" font-size="30" font-weight="800" fill="#1d1b19">둘 다 채우면 대상</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">5인 미만 사업장도 포함</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">알바·임시직·계약직도 포함</text>
<text x="80" y="742" font-size="26" fill="#1d1b19">근로계약서·4대보험 없어도 대상</text>
</svg>
