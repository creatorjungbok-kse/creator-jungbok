<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 860" width="800" height="860" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>국민취업지원제도로 받는 돈</title>
<rect width="800" height="860" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">국민취업지원제도로 받는 돈</text>
<text x="40" y="114" font-size="25" fill="#615e5a">유형과 취업 여부에 따라 달라요</text>
<rect x="40" y="150" width="720" height="222" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="222" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">구직촉진수당(1유형)</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">월 60만원씩 6개월</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">부양가족 1명당 월 10만원 추가</text>
<text x="80" y="338" font-size="26" fill="#1d1b19">(최대 월 40만원)</text>
<rect x="40" y="396" width="720" height="222" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="396" width="14" height="222" rx="7" fill="#f4b400"/>
<text x="80" y="450" font-size="30" font-weight="800" fill="#1d1b19">취업활동비용(2유형)</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">취업 준비에 필요한 비용 지원</text>
<text x="80" y="540" font-size="26" fill="#1d1b19">고용센터나 위탁기관에서</text>
<text x="80" y="584" font-size="26" fill="#1d1b19">취업상담을 받으면 지급</text>
<rect x="40" y="642" width="720" height="178" rx="22" fill="#f4b400" stroke="#1d1b19" stroke-width="0"/>
<text x="80" y="696" font-size="30" font-weight="800" fill="#1d1b19">취업성공수당(조건 충족 시)</text>
<text x="80" y="742" font-size="26" fill="#1d1b19">취업 후 6개월 계속 근무하면 50만원</text>
<text x="80" y="786" font-size="26" fill="#1d1b19">그 뒤 6개월 더 근무하면 100만원(최대 150만원)</text>
</svg>
