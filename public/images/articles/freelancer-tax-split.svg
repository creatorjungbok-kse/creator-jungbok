<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 772" width="800" height="772" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>3.3%는 이렇게 나뉘어요</title>
<rect width="800" height="772" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">3.3%는 이렇게 나뉘어요</text>
<text x="40" y="114" font-size="25" fill="#615e5a">계약금액 100만원 예시</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">소득세 3%</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">30,000원</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">지급처가 떼어 대신 내요</text>
<rect x="40" y="352" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">지방소득세 0.3%</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">3,000원</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">소득세의 10%</text>
<rect x="40" y="554" width="720" height="178" rx="22" fill="#f4b400" stroke="#1d1b19" stroke-width="0"/>
<text x="80" y="608" font-size="30" font-weight="800" fill="#1d1b19">받는 금액</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">967,000원</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">다음 해 5월 신고 때 정산해요</text>
</svg>
