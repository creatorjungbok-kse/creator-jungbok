<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 770" width="800" height="770" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>떼인 3.3% 정산 순서</title>
<rect width="800" height="770" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">떼인 3.3% 정산 순서</text>
<text x="40" y="114" font-size="25" fill="#615e5a">사업소득 3.3% 기준</text>
<circle cx="80" cy="200" r="32" fill="#f4b400"/><text x="80" y="212" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">1</text>
<text x="135" y="194" font-size="29" font-weight="800" fill="#1d1b19">일할 때</text>
<text x="135" y="236" font-size="24" fill="#615e5a">지급처가 3.3%를 떼고 줘요</text>
<line x1="80" y1="234" x2="80" y2="316" stroke="#1d1b19" stroke-width="4"/>
<circle cx="80" cy="350" r="32" fill="#f4b400"/><text x="80" y="362" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">2</text>
<text x="135" y="344" font-size="29" font-weight="800" fill="#1d1b19">다음 해 5월</text>
<text x="135" y="386" font-size="24" fill="#615e5a">홈택스·손택스로 종합소득세 신고</text>
<line x1="80" y1="384" x2="80" y2="466" stroke="#1d1b19" stroke-width="4"/>
<circle cx="80" cy="500" r="32" fill="#f4b400"/><text x="80" y="512" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">3</text>
<text x="135" y="494" font-size="29" font-weight="800" fill="#1d1b19">세금 계산</text>
<text x="135" y="536" font-size="24" fill="#615e5a">1년 소득과 경비, 공제를 반영해요</text>
<line x1="80" y1="534" x2="80" y2="616" stroke="#1d1b19" stroke-width="4"/>
<circle cx="80" cy="650" r="32" fill="#f4b400"/><text x="80" y="662" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">4</text>
<text x="135" y="644" font-size="29" font-weight="800" fill="#1d1b19">결과</text>
<text x="135" y="686" font-size="24" fill="#615e5a">미리 낸 세금이 많으면 환급, 적으면 추가 납부</text>
</svg>
