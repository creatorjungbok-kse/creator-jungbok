<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>실손24 보험청구 순서</title>
<rect width="800" height="1200" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">실손24 보험청구 순서</text>
<text x="40" y="114" font-size="25" fill="#615e5a">실손24 앱·홈페이지 기준(네이버·토스는 일부 자동 입력)</text>
<circle cx="80" cy="200" r="32" fill="#f4b400"/><text x="80" y="212" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">1</text>
<text x="135" y="194" font-size="29" font-weight="800" fill="#1d1b19">실손24 열기</text>
<text x="135" y="236" font-size="24" fill="#615e5a">앱 설치, 또는 네이버·토스에서 실손24 검색</text>
<line x1="80" y1="234" x2="80" y2="316" stroke="#1d1b19" stroke-width="4"/>
<circle cx="80" cy="350" r="32" fill="#f4b400"/><text x="80" y="362" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">2</text>
<text x="135" y="344" font-size="29" font-weight="800" fill="#1d1b19">본인인증</text>
<text x="135" y="386" font-size="24" fill="#615e5a">휴대폰·아이핀 인증, 회원가입 없이도 가능</text>
<line x1="80" y1="384" x2="80" y2="466" stroke="#1d1b19" stroke-width="4"/>
<circle cx="80" cy="500" r="32" fill="#f4b400"/><text x="80" y="512" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">3</text>
<text x="135" y="494" font-size="29" font-weight="800" fill="#1d1b19">보험계약 선택</text>
<text x="135" y="536" font-size="24" fill="#615e5a">가입한 실손보험이 자동으로 조회돼요</text>
<line x1="80" y1="534" x2="80" y2="616" stroke="#1d1b19" stroke-width="4"/>
<circle cx="80" cy="650" r="32" fill="#f4b400"/><text x="80" y="662" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">4</text>
<text x="135" y="644" font-size="29" font-weight="800" fill="#1d1b19">병원 선택</text>
<text x="135" y="686" font-size="24" fill="#615e5a">진료받은 병원을 검색해서 골라요</text>
<line x1="80" y1="684" x2="80" y2="766" stroke="#1d1b19" stroke-width="4"/>
<circle cx="80" cy="800" r="32" fill="#f4b400"/><text x="80" y="812" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">5</text>
<text x="135" y="794" font-size="29" font-weight="800" fill="#1d1b19">진료일과 진료내역 선택</text>
<text x="135" y="836" font-size="24" fill="#615e5a">조회일 기준 3년 안(2024.10.25 이후 진료)</text>
<line x1="80" y1="834" x2="80" y2="916" stroke="#1d1b19" stroke-width="4"/>
<circle cx="80" cy="950" r="32" fill="#f4b400"/><text x="80" y="962" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">6</text>
<text x="135" y="944" font-size="29" font-weight="800" fill="#1d1b19">청구서 작성</text>
<text x="135" y="986" font-size="24" fill="#615e5a">질병·상해, 처음 진료인지, 입금 계좌 입력</text>
<line x1="80" y1="984" x2="80" y2="1066" stroke="#1d1b19" stroke-width="4"/>
<circle cx="80" cy="1100" r="32" fill="#f4b400"/><text x="80" y="1112" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">7</text>
<text x="135" y="1094" font-size="29" font-weight="800" fill="#1d1b19">확인하고 전송</text>
<text x="135" y="1136" font-size="24" fill="#615e5a">영수증·처방전은 병원이 보험사로 보내요</text>
</svg>