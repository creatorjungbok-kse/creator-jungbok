<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 886" width="800" height="886" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>조기재취업수당 조건 4가지</title>
<rect width="800" height="886" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">조기재취업수당 조건 4가지</text>
<text x="40" y="114" font-size="25" fill="#615e5a">모두 갖춰야 받을 수 있어요</text>
<rect x="40" y="150" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">14일</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">실업 신고일부터 14일이 지난 뒤 재취업</text>
<rect x="40" y="308" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="308" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="362" font-size="30" font-weight="800" fill="#1d1b19">절반 이상</text>
<text x="80" y="408" font-size="26" fill="#1d1b19">재취업 전날 기준 소정급여일수를</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">절반 이상 남김(정확히 절반도 포함)</text>
<rect x="40" y="510" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="510" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="564" font-size="30" font-weight="800" fill="#1d1b19">12개월</text>
<text x="80" y="610" font-size="26" fill="#1d1b19">재취업 후 12개월 이상 계속 고용</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">또는 사업 영위</text>
<rect x="40" y="712" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="712" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="766" font-size="30" font-weight="800" fill="#1d1b19">제외 대상 아님</text>
<text x="80" y="812" font-size="26" fill="#1d1b19">예전 회사 재입사, 미리 약속한 채용 등 아님</text>
</svg>
