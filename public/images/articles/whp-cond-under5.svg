<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 860" width="800" height="860" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>5인 미만 사업장 비교</title>
<rect width="800" height="860" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">5인 미만 사업장 비교</text>
<text x="40" y="114" font-size="25" fill="#615e5a">주휴수당은 똑같이 적용돼요</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">똑같이 적용돼요</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">주휴수당</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">주 15시간·개근·1주 근로관계 조건</text>
<rect x="40" y="352" width="720" height="266" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="266" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">적용되지 않아요</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">공휴일 유급휴일</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">연장·야간·휴일근로 가산수당</text>
<text x="80" y="540" font-size="26" fill="#1d1b19">연차휴가 규정</text>
<text x="80" y="584" font-size="26" fill="#1d1b19">해고 제한·휴업수당 같은 규정 일부</text>
<rect x="40" y="642" width="720" height="178" rx="22" fill="#f4b400" stroke="#1d1b19" stroke-width="0"/>
<text x="80" y="696" font-size="30" font-weight="800" fill="#1d1b19">그래서 이렇게 돼요</text>
<text x="80" y="742" font-size="26" fill="#1d1b19">공휴일에 쉬어도 유급이 아닐 수 있어요</text>
<text x="80" y="786" font-size="26" fill="#1d1b19">주휴일에 일해도 1.5배 가산수당 의무 없음</text>
</svg>
