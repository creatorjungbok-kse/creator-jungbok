<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 842" width="800" height="842" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>가구소득 탈락 예시</title>
<rect width="800" height="842" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">가구소득 탈락 예시</text>
<text x="40" y="114" font-size="25" fill="#615e5a">본인과 부모님 두 분이 한 등본에 있는 3인 가구</text>
<rect x="40" y="150" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">본인 소득</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">500만원</text>
<rect x="40" y="308" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="308" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="362" font-size="30" font-weight="800" fill="#1d1b19">부모님 두 분 소득 합</text>
<text x="80" y="408" font-size="26" fill="#1d1b19">1억 2,400만원</text>
<rect x="40" y="466" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="466" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="520" font-size="30" font-weight="800" fill="#1d1b19">가구소득 합계</text>
<text x="80" y="566" font-size="26" fill="#1d1b19">1억 2,900만원</text>
<rect x="40" y="624" width="720" height="178" rx="22" fill="#f4b400" stroke="#1d1b19" stroke-width="0"/>
<text x="80" y="678" font-size="30" font-weight="800" fill="#1d1b19">3인 가구 200% 기준</text>
<text x="80" y="724" font-size="26" fill="#1d1b19">128,616,864원</text>
<text x="80" y="768" font-size="26" fill="#1d1b19">합계가 기준을 넘어 탈락해요</text>
</svg>
