<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1070" width="800" height="1070" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>국민취업지원제도 신청 순서</title>
<rect width="800" height="1070" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">국민취업지원제도 신청 순서</text>
<text x="40" y="114" font-size="25" fill="#615e5a">고용24에서 사전진단부터 시작해요</text>
<circle cx="80" cy="200" r="32" fill="#f4b400"/><text x="80" y="212" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">1</text>
<text x="135" y="194" font-size="29" font-weight="800" fill="#1d1b19">사전진단</text>
<text x="135" y="236" font-size="24" fill="#615e5a">고용24에서 대상인지 미리 확인</text>
<line x1="80" y1="234" x2="80" y2="316" stroke="#1d1b19" stroke-width="4"/>
<circle cx="80" cy="350" r="32" fill="#f4b400"/><text x="80" y="362" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">2</text>
<text x="135" y="344" font-size="29" font-weight="800" fill="#1d1b19">구직 등록과 안내 동영상</text>
<text x="135" y="386" font-size="24" fill="#615e5a">구직 등록 후 안내 동영상 꼭 시청</text>
<line x1="80" y1="384" x2="80" y2="466" stroke="#1d1b19" stroke-width="4"/>
<circle cx="80" cy="500" r="32" fill="#f4b400"/><text x="80" y="512" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">3</text>
<text x="135" y="494" font-size="29" font-weight="800" fill="#1d1b19">참여 신청</text>
<text x="135" y="536" font-size="24" fill="#615e5a">고용24 온라인 또는 관할 고용센터</text>
<line x1="80" y1="534" x2="80" y2="616" stroke="#1d1b19" stroke-width="4"/>
<circle cx="80" cy="650" r="32" fill="#f4b400"/><text x="80" y="662" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">4</text>
<text x="135" y="644" font-size="29" font-weight="800" fill="#1d1b19">심사</text>
<text x="135" y="686" font-size="24" fill="#615e5a">보통 1개월 안에 결과 안내</text>
<line x1="80" y1="684" x2="80" y2="766" stroke="#1d1b19" stroke-width="4"/>
<circle cx="80" cy="800" r="32" fill="#f4b400"/><text x="80" y="812" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">5</text>
<text x="135" y="794" font-size="29" font-weight="800" fill="#1d1b19">취업활동계획 수립</text>
<text x="135" y="836" font-size="24" fill="#615e5a">계획을 세우면 첫 수당 지급</text>
<line x1="80" y1="834" x2="80" y2="916" stroke="#1d1b19" stroke-width="4"/>
<circle cx="80" cy="950" r="32" fill="#f4b400"/><text x="80" y="962" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">6</text>
<text x="135" y="944" font-size="29" font-weight="800" fill="#1d1b19">활동과 수당</text>
<text x="135" y="986" font-size="24" fill="#615e5a">기본 1년, 최대 6개월 연장 가능</text>
</svg>
