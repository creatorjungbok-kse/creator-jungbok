<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 816" width="800" height="816" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>6+6 부모육아휴직제 한눈에</title>
<rect width="800" height="816" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">6+6 부모육아휴직제 한눈에</text>
<text x="40" y="114" font-size="25" fill="#615e5a">자녀 생후 18개월 전에 부모가 모두 시작</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">조건</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">부모 모두 18개월 전에 휴직 시작</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">같은 기간이든 차례로든 상관없음</text>
<rect x="40" y="352" width="720" height="222" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="222" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">첫 6개월 상한</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">1·2개월째 250만원, 3개월째 300만원</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">4개월째 350만원, 5개월째 400만원</text>
<text x="80" y="540" font-size="26" fill="#1d1b19">6개월째 450만원 (모두 100% 지급)</text>
<rect x="40" y="598" width="720" height="178" rx="22" fill="#f4b400" stroke="#1d1b19" stroke-width="0"/>
<text x="80" y="652" font-size="30" font-weight="800" fill="#1d1b19">적용 개월 수</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">두 사람이 각자 쓴 개월 수 중</text>
<text x="80" y="742" font-size="26" fill="#1d1b19">적은 쪽 (최대 6개월)</text>
</svg>
