<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 772" width="800" height="772" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>실업급여 준비물</title>
<rect width="800" height="772" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">실업급여 준비물</text>
<text x="40" y="114" font-size="25" fill="#615e5a">상황에 따라 챙길 것이 조금 달라요</text>
<rect x="40" y="150" width="720" height="222" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="222" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">누구나</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">신분증(본인이 직접 신청)</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">실업급여를 받을 계좌번호</text>
<text x="80" y="338" font-size="26" fill="#1d1b19">고용24 구직 등록·온라인 교육은 미리</text>
<rect x="40" y="396" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="396" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="450" font-size="30" font-weight="800" fill="#1d1b19">권고사직·계약만료</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">따로 낼 서류는 보통 없음</text>
<text x="80" y="540" font-size="26" fill="#1d1b19">회사가 상실신고·이직확인서 냈는지 확인</text>
<rect x="40" y="598" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="598" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="652" font-size="30" font-weight="800" fill="#1d1b19">자진퇴사지만 정당한 사유</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">사업주 확인서 같은 증빙이 더 필요할 수 있음</text>
</svg>
