<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 684" width="800" height="684" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Visa 카드 해외 결제 수수료 예시</title>
<rect width="800" height="684" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">Visa 카드 해외 결제 수수료 예시</text>
<text x="40" y="114" font-size="25" fill="#615e5a">Pro 월 $22(부가세 포함) 결제, 씨티카드 안내 기준</text>
<rect x="40" y="150" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">국제브랜드수수료 (Visa)</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">$22 × 1% = $0.22</text>
<rect x="40" y="308" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="308" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="362" font-size="30" font-weight="800" fill="#1d1b19">해외서비스수수료 (카드사)</text>
<text x="80" y="408" font-size="26" fill="#1d1b19">$22 × 0.25% = 약 $0.06</text>
<rect x="40" y="466" width="720" height="178" rx="22" fill="#f4b400" stroke="#1d1b19" stroke-width="0"/>
<text x="80" y="520" font-size="30" font-weight="800" fill="#1d1b19">합계</text>
<text x="80" y="566" font-size="26" fill="#1d1b19">약 $0.28이 더해져 원화로 청구돼요</text>
<text x="80" y="610" font-size="26" fill="#1d1b19">(카드사마다 수수료율이 조금씩 달라요)</text>
</svg>
