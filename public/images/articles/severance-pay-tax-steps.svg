<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>퇴직소득세 계산 순서와 예시</title>
<rect width="1200" height="900" fill="#fdfaf2"/>
<text x="60" y="78" font-size="40" font-weight="800" fill="#1d1b19">퇴직금 세금, 이렇게 계산합니다</text>
<text x="60" y="120" font-size="25" fill="#615e5a">예시: 10년 근무, 퇴직금 5,000만원 (비과세 소득 없음)</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d1b19"/></marker></defs>
<g stroke="#1d1b19" stroke-width="4" fill="#fff">
<rect x="60" y="150" width="1080" height="84" rx="16"/>
<rect x="60" y="264" width="1080" height="84" rx="16"/>
<rect x="60" y="378" width="1080" height="84" rx="16"/>
<rect x="60" y="492" width="1080" height="84" rx="16"/>
<rect x="60" y="606" width="1080" height="84" rx="16"/>
<rect x="60" y="720" width="1080" height="100" rx="16" fill="#f4b400"/>
</g>
<g stroke="#1d1b19" stroke-width="4" fill="none" marker-end="url(#a)">
<path d="M200 234V260"/><path d="M200 348V374"/><path d="M200 462V488"/><path d="M200 576V602"/><path d="M200 690V716"/>
</g>
<g font-size="26" font-weight="700" fill="#1d1b19">
<text x="92" y="202">① 근속연수공제</text><text x="92" y="316">② 환산급여</text><text x="92" y="430">③ 환산급여공제</text><text x="92" y="544">④ 과세표준 × 세율</text><text x="92" y="658">⑤ 12로 나누고 근속연수 곱하기</text><text x="92" y="772" font-size="28" font-weight="800">⑥ 지방소득세 10% 더하기</text>
</g>
<g font-size="23" fill="#3d3a36">
<text x="520" y="202">10년 → 500만 + 5년 × 200만 = 1,500만원</text>
<text x="520" y="316">(5,000만 − 1,500만) ÷ 10년 × 12 = 4,200만원</text>
<text x="520" y="430">800만 + (4,200만 − 800만) × 60% = 2,840만원</text>
<text x="520" y="544">4,200만 − 2,840만 = 1,360만원, × 6% = 81.6만원</text>
<text x="520" y="658">81.6만원 ÷ 12 × 10년 = 퇴직소득세 68만원</text>
</g>
<text x="520" y="772" font-size="25" font-weight="800" fill="#1d1b19">68만 + 6.8만 = 74.8만원 (약 1.5%)</text>
<text x="520" y="804" font-size="21" fill="#1d1b19">세후 퇴직금 약 4,925만원</text>
<text x="60" y="866" font-size="20" fill="#615e5a">근거: 소득세법 제48조·제55조, 지방세법 제103조의13, 국세청 퇴직소득세 계산방법 (2026년 10월 기준)</text>
</svg>
