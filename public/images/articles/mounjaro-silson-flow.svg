<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 840" width="800" height="840" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>마운자로 실비 적용 기준</title>
<rect width="800" height="840" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">마운자로 실비, 되나요?</text>
<text x="40" y="114" font-size="25" fill="#615e5a">처방 목적(진단 코드)에 따라 갈려요</text>
<rect x="200" y="150" width="400" height="80" rx="40" fill="#f4b400"/>
<text x="400" y="200" font-size="30" font-weight="800" fill="#1d1b19" text-anchor="middle">왜 처방받았나요?</text>
<line x1="400" y1="230" x2="400" y2="270" stroke="#1d1b19" stroke-width="4"/>
<line x1="210" y1="270" x2="590" y2="270" stroke="#1d1b19" stroke-width="4"/>
<line x1="210" y1="270" x2="210" y2="310" stroke="#1d1b19" stroke-width="4"/>
<line x1="590" y1="270" x2="590" y2="310" stroke="#1d1b19" stroke-width="4"/>
<rect x="35" y="310" width="350" height="500" rx="18" fill="#e6f4ea"/>
<text x="210" y="362" font-size="30" font-weight="800" fill="#1d1b19" text-anchor="middle">제2형 당뇨병 치료</text>
<circle cx="75" cy="420" r="20" fill="#1d1b19"/><text x="75" y="429" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="107" y="430" font-size="25" font-weight="800" fill="#1d1b19">보상 가능성 있어요</text>
<text x="107" y="466" font-size="22" fill="#615e5a">당뇨 진단(E11) 뒤</text>
<text x="107" y="498" font-size="22" fill="#615e5a">혈당 조절 목적 처방</text>
<circle cx="75" cy="560" r="20" fill="#1d1b19"/><text x="75" y="569" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="107" y="570" font-size="25" font-weight="800" fill="#1d1b19">비급여 보장 확인</text>
<text x="107" y="606" font-size="22" fill="#615e5a">실손 세대·특약과</text>
<text x="107" y="638" font-size="22" fill="#615e5a">통원 한도 안에서</text>
<circle cx="75" cy="700" r="20" fill="#1d1b19"/><text x="75" y="709" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="107" y="710" font-size="25" font-weight="800" fill="#1d1b19">심사가 까다로워요</text>
<text x="107" y="746" font-size="22" fill="#615e5a">당화혈색소 등</text>
<text x="107" y="778" font-size="22" fill="#615e5a">검사 결과를 요구해요</text>
<rect x="415" y="310" width="350" height="500" rx="18" fill="#fde8e6"/>
<text x="590" y="362" font-size="30" font-weight="800" fill="#1d1b19" text-anchor="middle">비만·체중 관리</text>
<circle cx="455" cy="420" r="20" fill="#1d1b19"/><text x="455" y="429" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="487" y="430" font-size="25" font-weight="800" fill="#1d1b19">보상 어려워요</text>
<text x="487" y="466" font-size="22" fill="#615e5a">비만 관련 의료비는</text>
<text x="487" y="498" font-size="22" fill="#615e5a">보상 안 하는 게 일반적</text>
<circle cx="455" cy="560" r="20" fill="#1d1b19"/><text x="455" y="569" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="487" y="570" font-size="25" font-weight="800" fill="#1d1b19">진단 코드 바꾸기 금지</text>
<text x="487" y="606" font-size="22" fill="#615e5a">허위 기재는</text>
<text x="487" y="638" font-size="22" fill="#615e5a">보험사기예요</text>
<circle cx="455" cy="700" r="20" fill="#1d1b19"/><text x="455" y="709" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="487" y="710" font-size="25" font-weight="800" fill="#1d1b19">비용은 직접 부담</text>
<text x="487" y="746" font-size="22" fill="#615e5a">비급여라 약국·병원마다</text>
<text x="487" y="778" font-size="22" fill="#615e5a">가격이 달라요</text>
</svg>