<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 930" width="800" height="930" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>번호이동 전에 확인할 것</title>
<rect width="800" height="930" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">번호이동 전에 확인할 것</text>
<text x="40" y="114" font-size="25" fill="#615e5a">한국통신사업자연합회·통신사 공식 안내 기준</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">번호이동 가능 시간</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">10시부터 20시까지</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">일요일, 명절 당일, 정기 점검일은 쉬어요</text>
<rect x="40" y="352" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">3개월 제한</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">번호이동·신규가입·명의변경일로부터</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">3개월 동안은 다시 번호이동이 제한돼요</text>
<rect x="40" y="554" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="554" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="608" font-size="30" font-weight="800" fill="#1d1b19">기존 통신사 비용</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">남은 할부금은 완납 또는 할부 계속</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">약정 중 해지면 할인반환금이 생길 수 있어요</text>
<rect x="40" y="756" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="756" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="810" font-size="30" font-weight="800" fill="#1d1b19">번호이동 수수료</text>
<text x="80" y="856" font-size="26" fill="#1d1b19">800원(통신사마다 부가세 표기 다름)</text>
</svg>
