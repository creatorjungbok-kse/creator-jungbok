<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 956" width="800" height="956" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>전기요금 복지할인 월 한도</title>
<rect width="800" height="956" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">전기요금 복지할인 월 한도</text>
<text x="40" y="114" font-size="25" fill="#615e5a">기타 계절 · 여름철(6월 1일부터 8월 31일까지)</text>
<rect x="40" y="150" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">장애인·유공자, 생계·의료급여 수급자</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">월 16,000원 · 여름철 20,000원</text>
<rect x="40" y="308" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="308" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="362" font-size="30" font-weight="800" fill="#1d1b19">주거·교육급여 수급자</text>
<text x="80" y="408" font-size="26" fill="#1d1b19">월 10,000원 · 여름철 12,000원</text>
<rect x="40" y="466" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="466" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="520" font-size="30" font-weight="800" fill="#1d1b19">차상위계층</text>
<text x="80" y="566" font-size="26" fill="#1d1b19">월 8,000원 · 여름철 10,000원</text>
<rect x="40" y="624" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="624" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="678" font-size="30" font-weight="800" fill="#1d1b19">대가족·3자녀·출산가구</text>
<text x="80" y="724" font-size="26" fill="#1d1b19">요금의 30% · 월 16,000원 한도</text>
<rect x="40" y="782" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="782" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="836" font-size="30" font-weight="800" fill="#1d1b19">생명유지장치 사용 가구</text>
<text x="80" y="882" font-size="26" fill="#1d1b19">요금의 30%</text>
</svg>
