<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>에너지바우처 잔액조회 3단계</title>
<rect width="800" height="640" fill="#fdfaf2"/>
<text x="40" y="72" font-size="40" font-weight="800" fill="#1d1b19">잔액조회는 복지로에서</text>
<text x="40" y="114" font-size="25" fill="#615e5a">사용기간에만 조회돼요</text>
<g>
<circle cx="90" cy="210" r="34" fill="#f4b400"/><text x="90" y="222" font-size="34" font-weight="800" fill="#1d1b19" text-anchor="middle">1</text>
<text x="150" y="200" font-size="30" font-weight="800" fill="#1d1b19">복지로 로그인</text>
<text x="150" y="242" font-size="24" fill="#615e5a">간편인증·공동인증서·금융인증서</text>
<line x1="90" y1="250" x2="90" y2="330" stroke="#1d1b19" stroke-width="4"/>
<circle cx="90" cy="370" r="34" fill="#f4b400"/><text x="90" y="382" font-size="34" font-weight="800" fill="#1d1b19" text-anchor="middle">2</text>
<text x="150" y="360" font-size="30" font-weight="800" fill="#1d1b19">복지지갑 → 나의 복지지갑</text>
<text x="150" y="402" font-size="24" fill="#615e5a">메뉴로 들어가기</text>
<line x1="90" y1="410" x2="90" y2="490" stroke="#1d1b19" stroke-width="4"/>
<circle cx="90" cy="530" r="34" fill="#f4b400"/><text x="90" y="542" font-size="34" font-weight="800" fill="#1d1b19" text-anchor="middle">3</text>
<text x="150" y="520" font-size="30" font-weight="800" fill="#1d1b19">에너지바우처 잔액 확인</text>
<text x="150" y="562" font-size="24" fill="#615e5a">상세 내역은 상담센터 1600-3190</text>
</g>
</svg>
