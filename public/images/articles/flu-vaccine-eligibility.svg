<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1018" width="800" height="1018" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>독감 무료접종 대상</title>
<rect width="800" height="1018" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">독감 무료접종 대상</text>
<text x="40" y="114" font-size="25" fill="#615e5a">2026-2027절기 국가 무료접종</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">65세 이상 어르신</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">1961년 12월 31일 이전 출생</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">주민등록상 출생연도 기준</text>
<rect x="40" y="352" width="720" height="222" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="222" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">어린이</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">생후 6개월부터 14세</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">2012년 1월 1일부터</text>
<text x="80" y="540" font-size="26" fill="#1d1b19">2026년 8월 31일 출생</text>
<rect x="40" y="598" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="598" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="652" font-size="30" font-weight="800" fill="#1d1b19">임신부</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">임신이 확인된 임신부</text>
<text x="80" y="742" font-size="26" fill="#1d1b19">임신 주수와 관계없음</text>
<rect x="40" y="800" width="720" height="178" rx="22" fill="#f4b400" stroke="#1d1b19" stroke-width="0"/>
<text x="80" y="854" font-size="30" font-weight="800" fill="#1d1b19">15세부터 64세</text>
<text x="80" y="900" font-size="26" fill="#1d1b19">임신부가 아니면 국가 무료 대상 아님</text>
<text x="80" y="944" font-size="26" fill="#1d1b19">지역 자체 지원은 보건소에 확인</text>
</svg>
