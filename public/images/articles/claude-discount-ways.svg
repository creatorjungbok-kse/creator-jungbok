<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 842" width="800" height="842" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>클로드 요금 아끼는 방법</title>
<rect width="800" height="842" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">클로드 요금 아끼는 방법</text>
<text x="40" y="114" font-size="25" fill="#615e5a">2026년 10월 28일 공식 안내 기준</text>
<rect x="40" y="150" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">1. 요금제를 맞게 고르기</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">Max 20x에서 5x로 내리면 월 $100 절약</text>
<rect x="40" y="308" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="308" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="362" font-size="30" font-weight="800" fill="#1d1b19">2. Pro는 연간 결제</text>
<text x="80" y="408" font-size="26" fill="#1d1b19">월 $20 × 12 = $240 → 연간 $200</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">1년에 $40 덜 내요(세전 기준)</text>
<rect x="40" y="510" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="510" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="564" font-size="30" font-weight="800" fill="#1d1b19">3. 학생은 학교 Education 플랜 확인</text>
<text x="80" y="610" font-size="26" fill="#1d1b19">개인 학생 할인은 안내돼 있지 않아요</text>
<rect x="40" y="668" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="668" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="722" font-size="30" font-weight="800" fill="#1d1b19">4. 카드는 달러로 결제</text>
<text x="80" y="768" font-size="26" fill="#1d1b19">원화 결제(DCC)를 고르면 수수료가 더 붙어요</text>
</svg>
