<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 930" width="800" height="930" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>이사로 그만둘 때 보는 것</title>
<rect width="800" height="930" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">이사로 그만둘 때 보는 것</text>
<text x="40" y="114" font-size="25" fill="#615e5a">왜, 얼마나 멀어졌는지와 그만둔 시기</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">인정되는 이유</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">회사 이전, 다른 지역 전근</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">배우자·부양 친족과 살기 위한 이사</text>
<rect x="40" y="352" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">인정이 어려운 이유</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">단순한 개인 사정으로 이사한 경우</text>
<rect x="40" y="510" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="510" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="564" font-size="30" font-weight="800" fill="#1d1b19">거리 기준</text>
<text x="80" y="610" font-size="26" fill="#1d1b19">통상의 교통수단으로 왕복 3시간 이상</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">걷기·갈아타기·기다리는 시간 포함</text>
<rect x="40" y="712" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="712" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="766" font-size="30" font-weight="800" fill="#1d1b19">그만두는 시기</text>
<text x="80" y="812" font-size="26" fill="#1d1b19">사유가 생긴 날부터 합리적인 기간 안</text>
<text x="80" y="856" font-size="26" fill="#1d1b19">상담 안내 기준 통상 1개월</text>
</svg>
