<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 772" width="800" height="772" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>일하면서 받을 때 감액 기준</title>
<rect width="800" height="772" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">일하면서 받을 때 감액 기준</text>
<text x="40" y="114" font-size="25" fill="#615e5a">2026년 기준, 수령 시작 후 5년 동안</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">월평균 소득금액 5,193,511원 이상</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">A값 3,193,511원 + 200만원</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">이 금액 이상일 때만 줄어요</text>
<rect x="40" y="352" width="720" height="222" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="222" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">소득금액은 세전 월급이 아니에요</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">근로소득공제·필요경비를 뺀 금액</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">근로소득만 있으면 월급 약 632만원</text>
<text x="80" y="540" font-size="26" fill="#1d1b19">이상부터 해당(12개월 근무 기준)</text>
<rect x="40" y="598" width="720" height="134" rx="22" fill="#f4b400" stroke="#1d1b19" stroke-width="0"/>
<text x="80" y="652" font-size="30" font-weight="800" fill="#1d1b19">줄어드는 한도</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">연금의 절반을 넘지 않아요</text>
</svg>
