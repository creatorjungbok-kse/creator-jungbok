<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 728" width="800" height="728" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>12월 31일 사용기한 기준</title>
<rect width="800" height="728" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">12월 31일 사용기한 기준</text>
<text x="40" y="114" font-size="25" fill="#615e5a">2026년 12월 31일 목요일까지</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">공연·전시·영화</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">관람일 기준</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">관람일이 2027년이면 사용 불가</text>
<rect x="40" y="352" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">도서</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">결제일 기준</text>
<rect x="40" y="510" width="720" height="178" rx="22" fill="#f4b400" stroke="#1d1b19" stroke-width="0"/>
<text x="80" y="564" font-size="30" font-weight="800" fill="#1d1b19">남은 잔액</text>
<text x="80" y="610" font-size="26" fill="#1d1b19">자동 반납, 다음 해로 이월 안 됨</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">누리집 마이페이지에서 확인</text>
</svg>
