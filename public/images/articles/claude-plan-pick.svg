<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 930" width="800" height="930" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>나에게 맞는 클로드 요금제</title>
<rect width="800" height="930" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">나에게 맞는 클로드 요금제</text>
<text x="40" y="114" font-size="25" fill="#615e5a">1년 넘게 써 본 경험 기준 추천</text>
<rect x="40" y="150" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">Free (무료)</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">가끔 질문하고 글 다듬는 정도</text>
<rect x="40" y="308" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="308" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="362" font-size="30" font-weight="800" fill="#1d1b19">Pro (월 $20)</text>
<text x="80" y="408" font-size="26" fill="#1d1b19">일반 사용자는 이걸로 충분</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">Claude Code도 쓸 수 있어요</text>
<rect x="40" y="510" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="510" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="564" font-size="30" font-weight="800" fill="#1d1b19">Max 5x (월 $100)</text>
<text x="80" y="610" font-size="26" fill="#1d1b19">사업, 코딩, Claude Code 작업에 적당</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">제가 지금 쓰는 요금제예요</text>
<rect x="40" y="712" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="712" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="766" font-size="30" font-weight="800" fill="#1d1b19">Max 20x (월 $200)</text>
<text x="80" y="812" font-size="26" fill="#1d1b19">아주 방대한 작업이 아니면</text>
<text x="80" y="856" font-size="26" fill="#1d1b19">5x부터 먼저 써 보세요</text>
</svg>
