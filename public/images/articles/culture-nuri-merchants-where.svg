<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1062" width="800" height="1062" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>쓸 수 있는 곳과 없는 곳</title>
<rect width="800" height="1062" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">쓸 수 있는 곳과 없는 곳</text>
<text x="40" y="114" font-size="25" fill="#615e5a">업종보다 가맹점 등록 여부가 먼저예요</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">쓸 수 있는 곳</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">문화·관광·체육 분야에</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">가맹점으로 등록된 곳(오프라인·온라인)</text>
<rect x="40" y="352" width="720" height="222" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="222" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">쓸 수 없는 곳</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">마트·백화점·다이소, 쿠팡 같은 오픈마켓</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">식당·카페, 옷과 신발 전부</text>
<text x="80" y="540" font-size="26" fill="#1d1b19">시내버스·지하철·택시</text>
<rect x="40" y="598" width="720" height="222" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="598" width="14" height="222" rx="7" fill="#f4b400"/>
<text x="80" y="652" font-size="30" font-weight="800" fill="#1d1b19">예외로 쓸 수 있는 곳</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">영화관 매점, 테마파크 안 음식점,</text>
<text x="80" y="742" font-size="26" fill="#1d1b19">지역축제 음식부스</text>
<text x="80" y="786" font-size="26" fill="#1d1b19">기차와 시외·고속버스</text>
<rect x="40" y="844" width="720" height="178" rx="22" fill="#f4b400" stroke="#1d1b19" stroke-width="0"/>
<text x="80" y="898" font-size="30" font-weight="800" fill="#1d1b19">등록 안 된 가게는 안 돼요</text>
<text x="80" y="944" font-size="26" fill="#1d1b19">같은 분야라도 가맹점으로</text>
<text x="80" y="988" font-size="26" fill="#1d1b19">등록되지 않으면 결제되지 않아요</text>
</svg>
