<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 728" width="800" height="728" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>원리금균등 vs 원금균등</title>
<rect width="800" height="728" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">원리금균등 vs 원금균등</text>
<text x="40" y="114" font-size="25" fill="#615e5a">1억원 · 연 4% · 30년 기준</text>
<rect x="40" y="150" width="720" height="222" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="222" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">첫 1년 낸 돈</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">원리금균등 5,728,980원</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">원금균등 7,272,207원</text>
<text x="80" y="338" font-size="26" fill="#1d1b19">약 154만원 차이</text>
<rect x="40" y="396" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="396" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="450" font-size="30" font-weight="800" fill="#1d1b19">146회차(약 12년 뒤)부터</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">원금균등 월 납입액이 더 적어짐</text>
<rect x="40" y="554" width="720" height="134" rx="22" fill="#f4b400" stroke="#1d1b19" stroke-width="0"/>
<text x="80" y="608" font-size="30" font-weight="800" fill="#1d1b19">총이자</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">원금균등이 11,702,618원 적음</text>
</svg>
