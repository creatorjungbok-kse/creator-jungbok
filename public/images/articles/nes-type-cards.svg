<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1168" width="800" height="1168" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>1유형과 2유형 한눈에 보기</title>
<rect width="800" height="1168" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">1유형과 2유형 한눈에 보기</text>
<text x="40" y="114" font-size="25" fill="#615e5a">소득과 재산에 따라 유형이 나뉘어요</text>
<rect x="40" y="150" width="720" height="310" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="310" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">1유형 요건심사형</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">가구·본인 소득 각각 중위소득 60% 이하</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">재산 4억원 이하(청년은 5억원 이하)</text>
<text x="80" y="338" font-size="26" fill="#1d1b19">신청 전 2년 안에 100일 또는</text>
<text x="80" y="382" font-size="26" fill="#1d1b19">800시간 이상 취업 경험</text>
<text x="80" y="426" font-size="26" fill="#1d1b19">→ 구직촉진수당</text>
<rect x="40" y="484" width="720" height="310" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="484" width="14" height="310" rx="7" fill="#f4b400"/>
<text x="80" y="538" font-size="30" font-weight="800" fill="#1d1b19">1유형 선발형</text>
<text x="80" y="584" font-size="26" fill="#1d1b19">취업 경험 부족: 소득은 요건심사형과 같고</text>
<text x="80" y="628" font-size="26" fill="#1d1b19">재산 4억원 이하</text>
<text x="80" y="672" font-size="26" fill="#1d1b19">청년: 가구 소득 중위소득 120% 이하,</text>
<text x="80" y="716" font-size="26" fill="#1d1b19">재산 5억원 이하</text>
<text x="80" y="760" font-size="26" fill="#1d1b19">예산 범위에서 선발 → 구직촉진수당</text>
<rect x="40" y="818" width="720" height="310" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="818" width="14" height="310" rx="7" fill="#f4b400"/>
<text x="80" y="872" font-size="30" font-weight="800" fill="#1d1b19">2유형</text>
<text x="80" y="918" font-size="26" fill="#1d1b19">청년: 소득과 관계없음</text>
<text x="80" y="962" font-size="26" fill="#1d1b19">중장년(35세부터 69세까지):</text>
<text x="80" y="1006" font-size="26" fill="#1d1b19">가구 소득 중위소득 100% 이하</text>
<text x="80" y="1050" font-size="26" fill="#1d1b19">특정계층: 소득을 보지 않거나 완화</text>
<text x="80" y="1094" font-size="26" fill="#1d1b19">→ 취업활동비용</text>
</svg>
