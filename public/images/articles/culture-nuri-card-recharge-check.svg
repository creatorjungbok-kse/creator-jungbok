<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>문화누리카드 2026 재신청 판단 흐름도</title>
<rect width="1200" height="760" fill="#fdfaf2"/>
<text x="60" y="78" font-size="40" font-weight="800" fill="#1d1b19">나는 다시 신청해야 할까?</text>
<text x="60" y="122" font-size="26" fill="#615e5a">2026년 문화누리카드 자동재충전 확인 순서</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d1b19"/></marker></defs>
<g font-size="27" font-weight="700" fill="#1d1b19">
<rect x="60" y="170" width="620" height="96" rx="18" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<text x="96" y="228">① 2025년에 문화누리카드를 받았다</text>
<rect x="60" y="330" width="620" height="96" rx="18" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<text x="96" y="388">② 2025년에 3만원 이상 썼다</text>
<rect x="60" y="490" width="620" height="96" rx="18" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<text x="96" y="548">③ 지금도 수급자격이 있고 제외 대상이 아니다</text>
</g>
<g stroke="#1d1b19" stroke-width="4" fill="none" marker-end="url(#a)">
<path d="M370 266V326"/><path d="M370 426V486"/><path d="M370 586V640"/>
<path d="M680 218H800"/><path d="M680 378H800"/><path d="M680 538H800"/>
</g>
<g font-size="24" font-weight="700" fill="#1d1b19"><text x="384" y="304">예</text><text x="384" y="464">예</text><text x="384" y="624">예</text>
<text x="700" y="204">아니오</text><text x="700" y="364">아니오</text><text x="700" y="524">아니오</text></g>
<rect x="60" y="646" width="620" height="90" rx="18" fill="#2f9e83" stroke="#1d1b19" stroke-width="4"/>
<text x="96" y="690" font-size="28" font-weight="800" fill="#fff">자동재충전 · 신청할 필요 없음</text>
<text x="96" y="722" font-size="22" fill="#fff">문자로 안내</text>
<rect x="806" y="170" width="340" height="416" rx="18" fill="#f4b400" stroke="#1d1b19" stroke-width="4"/>
<g fill="#1d1b19"><text x="836" y="232" font-size="30" font-weight="800">직접 신청</text>
<text x="836" y="282" font-size="27" font-weight="800">11월 30일까지</text>
<text x="836" y="342" font-size="23">· 주민센터</text>
<text x="836" y="382" font-size="23">· 누리집·앱</text>
<text x="836" y="422" font-size="23">· 전화 ARS 1544-3412</text>
<text x="836" y="452" font-size="19">  (재충전만, 14세 이상)</text>
<text x="836" y="520" font-size="20">예산이 다 쓰이면</text>
<text x="836" y="550" font-size="20">더 일찍 마감될 수 있음</text></g>
</svg>
