<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 974" width="800" height="974" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>무인민원발급기에서 뗄 수 있는 서류</title>
<rect width="800" height="974" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">무인민원발급기에서 뗄 수 있는 서류</text>
<text x="40" y="114" font-size="25" fill="#615e5a">목록에 네 보험을 모은 확인서는 없어요</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">건강보험</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">건강보험 자격득실확인서</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">자격확인서</text>
<rect x="40" y="352" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">국민연금</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">국민연금 가입자 가입증명</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">연금산정용 가입내역 확인서</text>
<rect x="40" y="554" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="554" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="608" font-size="30" font-weight="800" fill="#1d1b19">고용·산재보험</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">고용보험 자격이력내역서(근로자용)</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">고용·산재보험가입증명원</text>
<rect x="40" y="756" width="720" height="178" rx="22" fill="#f4b400" stroke="#1d1b19" stroke-width="0"/>
<text x="80" y="810" font-size="30" font-weight="800" fill="#1d1b19">정부24 안내 목록 기준</text>
<text x="80" y="856" font-size="26" fill="#1d1b19">수수료 무료, 본인 확인 필요</text>
<text x="80" y="900" font-size="26" fill="#1d1b19">장소마다 서류·시간·수수료 다를 수 있어요</text>
</svg>
