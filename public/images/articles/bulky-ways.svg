<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 772" width="800" height="772" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>신고 방법 세 가지</title>
<rect width="800" height="772" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">신고 방법 세 가지</text>
<text x="40" y="114" font-size="25" fill="#615e5a">어느 방법이 되는지는 시·군·구마다 달라요</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">인터넷</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">시·군·구 대형폐기물 누리집에서 신청·결제</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">필증 출력 또는 종이에 번호 적기</text>
<rect x="40" y="352" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">앱</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">지자체가 안내하는 앱만 (예: 빼기, 여기로)</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">마포구·연수구는 빼기, 부평구는 여기로</text>
<rect x="40" y="554" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="554" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="608" font-size="30" font-weight="800" fill="#1d1b19">주민센터·스티커</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">행정복지센터 방문 신고, 판매처 스티커</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">청주시·부평구 등 일부는 무인발급기도 있어요</text>
</svg>
