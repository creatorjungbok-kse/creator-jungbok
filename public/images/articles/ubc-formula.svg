<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 930" width="800" height="930" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>실업급여 하루 금액 계산법</title>
<rect width="800" height="930" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">실업급여 하루 금액 계산법</text>
<text x="40" y="114" font-size="25" fill="#615e5a">2026년 기준, 고용보험법 제45조·제46조</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">1. 하루 평균임금 구하기</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">퇴사 전 3개월 임금(세전) ÷ 그 3개월 날수</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">(89일부터 92일)</text>
<rect x="40" y="352" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">2. 60% 곱하기</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">하루 평균임금 × 60%</text>
<rect x="40" y="510" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="510" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="564" font-size="30" font-weight="800" fill="#1d1b19">3. 상한·하한으로 자르기</text>
<text x="80" y="610" font-size="26" fill="#1d1b19">상한 하루 68,100원</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">하한 최저시급 10,320원 × 근무시간 × 80%</text>
<rect x="40" y="712" width="720" height="178" rx="22" fill="#f4b400" stroke="#1d1b19" stroke-width="0"/>
<text x="80" y="766" font-size="30" font-weight="800" fill="#1d1b19">결과</text>
<text x="80" y="812" font-size="26" fill="#1d1b19">대부분 하루 66,048원부터 68,100원 사이</text>
<text x="80" y="856" font-size="26" fill="#1d1b19">(하루 8시간 근무 기준)</text>
</svg>
