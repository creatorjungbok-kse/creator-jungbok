<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>주휴수당 조건 판단 흐름도</title>
<rect width="1200" height="860" fill="#fdfaf2"/>
<text x="60" y="78" font-size="40" font-weight="800" fill="#1d1b19">이번 주 주휴수당, 받을 수 있을까?</text>
<text x="60" y="120" font-size="25" fill="#615e5a">위에서부터 하나씩 확인 · 하나라도 '아니오'면 그 주는 원칙적으로 없음</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d1b19"/></marker></defs>
<g font-size="26" font-weight="700" fill="#1d1b19">
<rect x="60" y="150" width="700" height="104" rx="16" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<text x="92" y="194">① 근로기준법상 근로자다</text>
<text x="92" y="232" font-size="21" font-weight="400">알바·파트타임·일용직도 근로자라면 해당</text>
<rect x="60" y="300" width="700" height="104" rx="16" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<text x="92" y="344">② 4주 평균 1주 약속한 근로시간 15시간 이상</text>
<text x="92" y="382" font-size="21" font-weight="400">계약한 시간 기준 · 연장근로는 넣지 않음</text>
<rect x="60" y="450" width="700" height="104" rx="16" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<text x="92" y="494">③ 그 주에 일하기로 한 날을 모두 출근</text>
<text x="92" y="532" font-size="21" font-weight="400">지각·조퇴·휴가·휴일은 결근이 아님</text>
<rect x="60" y="600" width="700" height="104" rx="16" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<text x="92" y="644">④ 1주(연속 7일) 동안 근로관계가 이어졌다</text>
<text x="92" y="682" font-size="21" font-weight="400">그만두는 주는 7일을 채웠는지 확인</text>
</g>
<g stroke="#1d1b19" stroke-width="4" fill="none" marker-end="url(#a)">
<path d="M410 254V296"/><path d="M410 404V446"/><path d="M410 554V596"/><path d="M410 704V746"/>
<path d="M760 202H850"/><path d="M760 352H850"/><path d="M760 502H850"/><path d="M760 652H850"/>
</g>
<g font-size="21" font-weight="700" fill="#1d1b19"><text x="422" y="282">예</text><text x="422" y="432">예</text><text x="422" y="582">예</text><text x="422" y="734">예</text>
<text x="772" y="190">아니오</text><text x="772" y="340">아니오</text><text x="772" y="490">아니오</text><text x="772" y="640">아니오</text></g>
<rect x="860" y="150" width="280" height="554" rx="16" fill="#f3f1ec" stroke="#1d1b19" stroke-width="4"/>
<g font-size="27" font-weight="800" fill="#1d1b19"><text x="886" y="210">그 주는</text><text x="886" y="250">주휴수당 없음</text></g>
<g font-size="21" fill="#3d3a36"><text x="886" y="310">· 다음 주는</text><text x="906" y="340">다시 판단</text><text x="886" y="390">· 일용직은 계약을</text><text x="906" y="420">반복해 계속</text><text x="906" y="450">일했는지가 중요</text><text x="886" y="500">· 애매하면</text><text x="906" y="530">1350 상담</text></g>
<rect x="60" y="750" width="1080" height="80" rx="16" fill="#f4b400" stroke="#1d1b19" stroke-width="4"/>
<text x="92" y="802" font-size="28" font-weight="800" fill="#1d1b19">모두 '예' → 그 주 주휴수당 발생 (5인 미만 사업장도 같음)</text>
</svg>
