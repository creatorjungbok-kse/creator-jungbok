<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 820" width="800" height="820" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>에너지바우처 대상 확인 두 단계</title>
<rect width="800" height="820" fill="#fdfaf2"/>
<text x="40" y="72" font-size="40" font-weight="800" fill="#1d1b19">에너지바우처 대상일까</text>
<text x="40" y="114" font-size="25" fill="#615e5a">두 가지를 모두 충족해야 해요</text>
<rect x="40" y="150" width="720" height="210" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="210" rx="7" fill="#f4b400"/>
<text x="80" y="205" font-size="30" font-weight="800" fill="#1d1b19">① 소득 기준</text>
<text x="80" y="258" font-size="27" fill="#1d1b19">생계·의료·주거·교육급여 중</text>
<text x="80" y="300" font-size="27" fill="#1d1b19">하나를 받는 기초생활수급자</text>
<text x="400" y="420" font-size="56" font-weight="800" fill="#1d1b19" text-anchor="middle">+</text>
<rect x="40" y="460" width="720" height="320" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="460" width="14" height="320" rx="7" fill="#f4b400"/>
<text x="80" y="515" font-size="30" font-weight="800" fill="#1d1b19">② 세대원 기준 (한 명 이상)</text>
<g font-size="26" fill="#1d1b19">
<text x="80" y="568">· 노인(1961.12.31 이전 출생)</text>
<text x="80" y="608">· 7세 이하 취학 전 아동</text>
<text x="80" y="648">· 등록 장애인 · 임산부</text>
<text x="80" y="688">· 중증·희귀·중증난치질환자</text>
<text x="80" y="728">· 한부모가족 · 소년소녀가정 · 다자녀세대</text>
</g>
</svg>
