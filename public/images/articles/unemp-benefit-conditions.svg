<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 974" width="800" height="974" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>실업급여 4가지 조건</title>
<rect width="800" height="974" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">실업급여 4가지 조건</text>
<text x="40" y="114" font-size="25" fill="#615e5a">법령 이름은 구직급여, 모두 갖춰야 해요</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">1. 가입기간</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">이직일 전 18개월 동안</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">피보험 단위기간 합쳐서 180일 이상</text>
<rect x="40" y="352" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">2. 그만둔 이유</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">권고사직·계약만료 등 비자발적 이직</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">또는 법이 정한 정당한 사유</text>
<rect x="40" y="554" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="554" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="608" font-size="30" font-weight="800" fill="#1d1b19">3. 일할 의사·능력</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">일할 의사와 능력이 있는데도</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">취업하지 못한 상태</text>
<rect x="40" y="756" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="756" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="810" font-size="30" font-weight="800" fill="#1d1b19">4. 재취업 노력</text>
<text x="80" y="856" font-size="26" fill="#1d1b19">재취업을 위해 적극적으로 노력</text>
<text x="80" y="900" font-size="26" fill="#1d1b19">실업인정 때 구직활동으로 증명</text>
</svg>
