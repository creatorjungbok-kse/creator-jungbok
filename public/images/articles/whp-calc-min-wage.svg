<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 816" width="800" height="816" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>주휴 포함 시급, 최저임금 넘을까</title>
<rect width="800" height="816" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">주휴 포함 시급, 최저임금 넘을까</text>
<text x="40" y="114" font-size="25" fill="#615e5a">주휴 포함 시급 ÷ 1.2 = 주휴수당을 뺀 시급</text>
<rect x="40" y="150" width="720" height="222" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="222" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">주휴 포함 12,000원</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">12,000 ÷ 1.2 = 시급 10,000원</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">2026년 최저임금(10,320원)보다 낮아요</text>
<text x="80" y="338" font-size="26" fill="#1d1b19">최저임금 위반 소지가 있어요</text>
<rect x="40" y="396" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="396" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="450" font-size="30" font-weight="800" fill="#1d1b19">주휴 포함 13,000원</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">13,000 ÷ 1.2 = 약 10,833원</text>
<text x="80" y="540" font-size="26" fill="#1d1b19">2026년·2027년 최저임금 이상이에요</text>
<rect x="40" y="598" width="720" height="178" rx="22" fill="#f4b400" stroke="#1d1b19" stroke-width="0"/>
<text x="80" y="652" font-size="30" font-weight="800" fill="#1d1b19">최저임금을 지키려면</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">2026년: 주휴 포함 12,384원 이상</text>
<text x="80" y="742" font-size="26" fill="#1d1b19">2027년: 주휴 포함 12,840원 이상</text>
</svg>
