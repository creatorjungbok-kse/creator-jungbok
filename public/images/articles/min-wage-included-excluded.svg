<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 746" width="800" height="746" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>들어가는 돈과 빠지는 돈</title>
<rect width="800" height="746" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">들어가는 돈과 빠지는 돈</text>
<text x="40" y="114" font-size="25" fill="#615e5a">최저임금 계산에 넣는 돈과 빼는 돈</text>
<rect x="40" y="150" width="720" height="266" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="266" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">들어가는 돈</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">기본급, 매월 주는 직무·직책수당</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">주휴수당(유급 주휴일 임금)</text>
<text x="80" y="338" font-size="26" fill="#1d1b19">매달 1회 이상 주는 상여금</text>
<text x="80" y="382" font-size="26" fill="#1d1b19">매달 현금 식대·교통비·숙박비</text>
<rect x="40" y="440" width="720" height="266" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="440" width="14" height="266" rx="7" fill="#f4b400"/>
<text x="80" y="494" font-size="30" font-weight="800" fill="#1d1b19">빠지는 돈</text>
<text x="80" y="540" font-size="26" fill="#1d1b19">연장·휴일근로 임금, 연장·야간·휴일 가산임금</text>
<text x="80" y="584" font-size="26" fill="#1d1b19">연차휴가 미사용수당</text>
<text x="80" y="628" font-size="26" fill="#1d1b19">1개월 넘는 주기 상여금</text>
<text x="80" y="672" font-size="26" fill="#1d1b19">식사·숙소 같은 현물</text>
</svg>
