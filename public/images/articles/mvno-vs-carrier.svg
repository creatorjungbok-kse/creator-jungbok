<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 772" width="800" height="772" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>통신사 최저 요금제와 알뜰폰 비교</title>
<rect width="800" height="772" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">통신사 최저 요금제와 알뜰폰 비교</text>
<text x="40" y="114" font-size="25" fill="#615e5a">2026년 10월 25일·28일 공식 화면 기준 예시</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">LG유플러스 데이터플랜300MB</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">월 28,000원(약정 할인 시 21,000원)</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">데이터 300MB, 통화 125분, 문자 150건</text>
<rect x="40" y="352" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">알뜰폰 예시(KT망, 7GB+1Mbps)</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">6개월간 월 2,500원, 이후 월 23,100원</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">특정 요금제 추천이 아닌 예시예요</text>
<rect x="40" y="554" width="720" height="178" rx="22" fill="#f4b400" stroke="#1d1b19" stroke-width="0"/>
<text x="80" y="608" font-size="30" font-weight="800" fill="#1d1b19">비교 포인트</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">같은 돈이면 데이터·통화가 얼마나 되는지</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">할인이 끝난 뒤 요금까지 함께 보기</text>
</svg>
