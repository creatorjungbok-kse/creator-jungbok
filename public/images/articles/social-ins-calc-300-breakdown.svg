<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>월 300만원 근로자 공제 내역</title>
<rect width="800" height="1000" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">월 300만원 근로자 공제 내역</text>
<text x="40" y="114" font-size="25" fill="#615e5a">2026년 7월 이후, 150명 미만 회사 기준</text>
<rect x="40" y="150" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">국민연금 4.75%</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">142,500원</text>
<rect x="40" y="308" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="308" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="362" font-size="30" font-weight="800" fill="#1d1b19">건강보험 3.595%</text>
<text x="80" y="408" font-size="26" fill="#1d1b19">107,850원</text>
<rect x="40" y="466" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="466" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="520" font-size="30" font-weight="800" fill="#1d1b19">장기요양 건강보험료의 13.14%</text>
<text x="80" y="566" font-size="26" fill="#1d1b19">14,170원</text>
<rect x="40" y="624" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="624" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="678" font-size="30" font-weight="800" fill="#1d1b19">고용보험 0.9%</text>
<text x="80" y="724" font-size="26" fill="#1d1b19">27,000원</text>
<rect x="40" y="782" width="720" height="178" rx="22" fill="#f4b400" stroke="#1d1b19" stroke-width="0"/>
<text x="80" y="836" font-size="30" font-weight="800" fill="#1d1b19">근로자 공제 합계</text>
<text x="80" y="882" font-size="26" fill="#1d1b19">291,520원</text>
<text x="80" y="926" font-size="26" fill="#1d1b19">10원 미만은 버린 금액</text>
</svg>
