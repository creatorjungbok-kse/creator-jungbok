<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1220" width="800" height="1220" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>나도 받을 수 있을까</title>
<rect width="800" height="1220" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">나도 받을 수 있을까</text>
<text x="40" y="114" font-size="25" fill="#615e5a">국민내일배움카드 운영규정·고용24 안내 기준</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">실업자</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">받을 수 있어요</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">카드 신청 전에 고용24 구직 등록 먼저</text>
<rect x="40" y="352" width="720" height="222" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="222" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">재직자(휴직자 포함)</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">받을 수 있어요, 구직 등록 필요 없음</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">대기업·45세 미만·월 300만원 이상은 제외</text>
<text x="80" y="540" font-size="26" fill="#1d1b19">(기간제·육아휴직 등 예외 있음)</text>
<rect x="40" y="598" width="720" height="222" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="598" width="14" height="222" rx="7" fill="#f4b400"/>
<text x="80" y="652" font-size="30" font-weight="800" fill="#1d1b19">자영업자</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">받을 수 있어요</text>
<text x="80" y="742" font-size="26" fill="#1d1b19">개업 1년 미만, 연 매출 4억원 이상은 제외</text>
<text x="80" y="786" font-size="26" fill="#1d1b19">(고용보험 가입 자영업자는 예외)</text>
<rect x="40" y="844" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="844" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="898" font-size="30" font-weight="800" fill="#1d1b19">대학생</text>
<text x="80" y="944" font-size="26" fill="#1d1b19">졸업까지 2년 이내 남았으면 가능</text>
<text x="80" y="988" font-size="26" fill="#1d1b19">원격대학 재학생, 고용보험 가입자도 가능</text>
<rect x="40" y="1046" width="720" height="134" rx="22" fill="#f4b400" stroke="#1d1b19" stroke-width="0"/>
<text x="80" y="1100" font-size="30" font-weight="800" fill="#1d1b19">받을 수 없는 사람</text>
<text x="80" y="1146" font-size="26" fill="#1d1b19">공무원·사립학교 교직원, 75세 이상 등</text>
</svg>
