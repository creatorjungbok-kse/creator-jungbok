<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>간이과세 가능 여부 판단 흐름도</title>
<rect width="1200" height="780" fill="#fdfaf2"/>
<text x="60" y="78" font-size="40" font-weight="800" fill="#1d1b19">간이과세자가 될 수 있을까?</text>
<text x="60" y="120" font-size="25" fill="#615e5a">위에서부터 하나씩 확인 · 하나라도 '아니오'면 원칙적으로 일반과세자</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d1b19"/></marker></defs>
<g font-size="26" font-weight="700" fill="#1d1b19">
<rect x="60" y="150" width="680" height="84" rx="16" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<text x="92" y="202">① 법인이 아닌 개인사업자다</text>
<rect x="60" y="280" width="680" height="104" rx="16" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<text x="92" y="324">② 직전 연도 매출(부가세 포함) 1억400만원 미만</text>
<text x="92" y="362" font-size="21" font-weight="400">부동산임대업·과세유흥장소는 4,800만원 미만, 신규는 예상 매출</text>
<rect x="60" y="430" width="680" height="104" rx="16" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<text x="92" y="474">③ 간이과세 배제 업종이 아니다</text>
<text x="92" y="512" font-size="21" font-weight="400">제조·도매·건설·전문직 등. 최종소비자 대상 예외 있음</text>
<rect x="60" y="580" width="680" height="104" rx="16" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<text x="92" y="624">④ 다른 배제 사유가 없다</text>
<text x="92" y="662" font-size="20" font-weight="400">일반과세 사업장, 일반과세자 사업 인수(예외 있음), 복식부기의무 등</text>
</g>
<g stroke="#1d1b19" stroke-width="4" fill="none" marker-end="url(#a)">
<path d="M400 234V276"/><path d="M400 384V426"/><path d="M400 534V576"/><path d="M400 684V716"/>
<path d="M740 192H830"/><path d="M740 332H830"/><path d="M740 482H830"/><path d="M740 632H830"/>
</g>
<g font-size="21" font-weight="700" fill="#1d1b19"><text x="412" y="262">예</text><text x="412" y="412">예</text><text x="412" y="562">예</text><text x="412" y="708">예</text>
<text x="754" y="180">아니오</text><text x="754" y="320">아니오</text><text x="754" y="470">아니오</text><text x="754" y="620">아니오</text></g>
<rect x="60" y="720" width="680" height="50" rx="14" fill="#2f9e83" stroke="#1d1b19" stroke-width="4"/>
<text x="92" y="754" font-size="25" font-weight="800" fill="#fff">간이과세 가능 · 등록할 때 간이과세 신고</text>
<rect x="836" y="150" width="310" height="534" rx="18" fill="#f4b400" stroke="#1d1b19" stroke-width="4"/>
<g fill="#1d1b19"><text x="864" y="214" font-size="31" font-weight="800">일반과세자</text>
<text x="864" y="272" font-size="22">· 세율 10%</text>
<text x="864" y="310" font-size="22">· 매입세액 공제</text>
<text x="864" y="348" font-size="22">· 세금계산서 발급</text>
<text x="864" y="386" font-size="22">· 환급 가능</text>
<text x="864" y="452" font-size="20">간이과세 대상이어도</text>
<text x="864" y="482" font-size="20">포기 신고로 일반과세를</text>
<text x="864" y="512" font-size="20">고를 수 있음</text>
<text x="864" y="548" font-size="20">(원칙적으로 3년 재적용 제한)</text></g>
</svg>
