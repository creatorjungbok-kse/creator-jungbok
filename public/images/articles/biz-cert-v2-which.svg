<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 974" width="800" height="974" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>어떤 서류가 필요할까</title>
<rect width="800" height="974" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">어떤 서류가 필요할까</text>
<text x="40" y="114" font-size="25" fill="#615e5a">제출처가 적어 준 서류명을 기준으로 골라요</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">사업자등록증 사본</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">갖고 있는 등록증을 복사해서 내기</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">없으면 홈택스 재발급(수수료 없음)</text>
<rect x="40" y="352" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">사업자등록증명</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">재출력으로 대신할 수 없는 별도 서류</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">홈택스·정부24·무인발급기·세무서</text>
<rect x="40" y="554" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="554" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="608" font-size="30" font-weight="800" fill="#1d1b19">등록 내용이 바뀌었다면</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">재발급이 아니라 정정신고</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">상호는 당일, 업종·주소는 2일 이내</text>
<rect x="40" y="756" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="756" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="810" font-size="30" font-weight="800" fill="#1d1b19">폐업했거나 사업자가 아니라면</text>
<text x="80" y="856" font-size="26" fill="#1d1b19">폐업사실증명(휴업은 휴업사실증명)</text>
<text x="80" y="900" font-size="26" fill="#1d1b19">사실증명(사업자등록사실여부)</text>
</svg>
