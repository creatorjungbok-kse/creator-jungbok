<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 772" width="800" height="772" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>클로드 코드는 어떤 요금제로</title>
<rect width="800" height="772" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">클로드 코드는 어떤 요금제로</text>
<text x="40" y="114" font-size="25" fill="#615e5a">운영자가 1년 넘게 써 본 경험 기준</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">Pro (월 $20)</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">클로드 코드가 포함돼 있어요</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">사업·코딩 작업에는 부족했어요</text>
<rect x="40" y="352" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">Max 5x (월 $100)</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">사업, 코딩 작업에 적당</text>
<text x="80" y="496" font-size="26" fill="#1d1b19">제가 지금 쓰는 요금제예요</text>
<rect x="40" y="554" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="554" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="608" font-size="30" font-weight="800" fill="#1d1b19">Max 20x (월 $200)</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">써 봤지만 사용량이 남았어요</text>
<text x="80" y="698" font-size="26" fill="#1d1b19">아주 방대한 작업이 아니면 5x부터</text>
</svg>
