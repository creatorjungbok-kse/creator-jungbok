<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>실손24 서류 보완하는 순서</title>
<rect width="800" height="900" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">실손24 서류 보완하는 순서</text>
<text x="40" y="114" font-size="25" fill="#615e5a">보험사가 서류를 더 내라고 할 때</text>
<circle cx="80" cy="200" r="32" fill="#f4b400"/><text x="80" y="212" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">1</text>
<text x="135" y="194" font-size="29" font-weight="800" fill="#1d1b19">실손24 로그인</text>
<text x="135" y="236" font-size="24" fill="#615e5a">앱이나 홈페이지에 본인인증으로 들어가요</text>
<line x1="80" y1="234" x2="80" y2="316" stroke="#1d1b19" stroke-width="4"/>
<circle cx="80" cy="350" r="32" fill="#f4b400"/><text x="80" y="362" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">2</text>
<text x="135" y="344" font-size="29" font-weight="800" fill="#1d1b19">마이페이지 → 청구이력</text>
<text x="135" y="386" font-size="24" fill="#615e5a">내가 청구한 목록이 나와요</text>
<line x1="80" y1="384" x2="80" y2="466" stroke="#1d1b19" stroke-width="4"/>
<circle cx="80" cy="500" r="32" fill="#f4b400"/><text x="80" y="512" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">3</text>
<text x="135" y="494" font-size="29" font-weight="800" fill="#1d1b19">서류보완청구 누르기</text>
<text x="135" y="536" font-size="24" fill="#615e5a">청구건마다 있어요, 안 보이면 보험사에 문의</text>
<line x1="80" y1="534" x2="80" y2="616" stroke="#1d1b19" stroke-width="4"/>
<circle cx="80" cy="650" r="32" fill="#f4b400"/><text x="80" y="662" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">4</text>
<text x="135" y="644" font-size="29" font-weight="800" fill="#1d1b19">서류 사진 첨부</text>
<text x="135" y="686" font-size="24" fill="#615e5a">진단서·확인서를 사진이나 스캔으로 올려요</text>
<line x1="80" y1="684" x2="80" y2="766" stroke="#1d1b19" stroke-width="4"/>
<circle cx="80" cy="800" r="32" fill="#f4b400"/><text x="80" y="812" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">5</text>
<text x="135" y="794" font-size="29" font-weight="800" fill="#1d1b19">제출하기</text>
<text x="135" y="836" font-size="24" fill="#615e5a">추가 서류가 보험사로 넘어가요</text>
</svg>