<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>자진퇴사 실업급여 확인 순서</title>
<rect width="1200" height="860" fill="#fdfaf2"/>
<text x="60" y="78" font-size="40" font-weight="800" fill="#1d1b19">자진퇴사, 이 순서로 확인해요</text>
<text x="60" y="120" font-size="25" fill="#615e5a">스스로 그만둬도 법이 정한 사유와 증빙이 있으면 받을 수 있어요</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d1b19"/></marker></defs>
<g stroke="#1d1b19" stroke-width="4">
<rect x="60" y="150" width="1080" height="120" rx="16" fill="#fff"/>
<rect x="60" y="300" width="1080" height="120" rx="16" fill="#f4b400"/>
<rect x="60" y="450" width="1080" height="120" rx="16" fill="#fff"/>
<rect x="60" y="600" width="1080" height="120" rx="16" fill="#fff"/>
</g>
<g stroke="#1d1b19" stroke-width="4" fill="none" marker-end="url(#a)">
<path d="M150 270V296"/><path d="M150 420V446"/><path d="M150 570V596"/>
</g>
<g font-size="29" font-weight="800" fill="#1d1b19">
<text x="92" y="200">① 기본 조건: 18개월 안에 피보험 단위기간 180일</text>
<text x="92" y="350">② 법이 정한 정당한 사유에 해당하나요?</text>
<text x="92" y="500">③ 사유를 보여 줄 증빙을 모아요</text>
<text x="92" y="650">④ 고용센터가 이직확인서와 증빙으로 판단</text>
</g>
<g font-size="23" fill="#3d3a36">
<text x="92" y="244">모자라면 사유가 있어도 받을 수 없어요</text>
<text x="92" y="394" fill="#1d1b19">임금체불 2개월 · 통근 왕복 3시간 · 질병 · 육아 · 계약만료 · 괴롭힘 등</text>
<text x="92" y="544">진단서·사업주 확인서·임금체불확인서·인사발령장·주민등록 등</text>
<text x="92" y="694">회사가 '자진퇴사'로 적어도 증빙으로 정당한 사유를 인정받을 수 있어요</text>
</g>
<text x="60" y="780" font-size="22" fill="#3d3a36">사유가 생긴 뒤 너무 오래 다니다 그만두면 인과관계를 인정받기 어려워요(상담 안내: 통상 1개월).</text>
<text x="60" y="824" font-size="19" fill="#615e5a">근거: 고용보험법 시행규칙 [별표 2](2024.7.1 개정), 고용노동부 고객상담센터 상담 안내</text>
</svg>
