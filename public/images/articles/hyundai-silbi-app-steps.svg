<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" width="800" height="1050" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>현대해상 어플로 실비 청구하는 순서</title>
<rect width="800" height="1050" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">현대해상 어플로 실비 청구하는 순서</text>
<text x="40" y="114" font-size="25" fill="#615e5a">현대해상 공식 모바일 앱 기준</text>
<circle cx="80" cy="200" r="32" fill="#f4b400"/><text x="80" y="212" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">1</text>
<text x="135" y="194" font-size="29" font-weight="800" fill="#1d1b19">질병/상해 보험금 청구 선택</text>
<text x="135" y="236" font-size="24" fill="#615e5a">보험금 청구 메뉴에서 골라요</text>
<line x1="80" y1="234" x2="80" y2="316" stroke="#1d1b19" stroke-width="4"/>
<circle cx="80" cy="350" r="32" fill="#f4b400"/><text x="80" y="362" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">2</text>
<text x="135" y="344" font-size="29" font-weight="800" fill="#1d1b19">로그인</text>
<text x="135" y="386" font-size="24" fill="#615e5a">간편인증, 카카오페이, 휴대전화 인증 등</text>
<line x1="80" y1="384" x2="80" y2="466" stroke="#1d1b19" stroke-width="4"/>
<circle cx="80" cy="500" r="32" fill="#f4b400"/><text x="80" y="512" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">3</text>
<text x="135" y="494" font-size="29" font-weight="800" fill="#1d1b19">청구 대상 선택</text>
<text x="135" y="536" font-size="24" fill="#615e5a">본인, 배우자, 자녀 등 치료받은 사람</text>
<line x1="80" y1="534" x2="80" y2="616" stroke="#1d1b19" stroke-width="4"/>
<circle cx="80" cy="650" r="32" fill="#f4b400"/><text x="80" y="662" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">4</text>
<text x="135" y="644" font-size="29" font-weight="800" fill="#1d1b19">개인정보처리 동의</text>
<text x="135" y="686" font-size="24" fill="#615e5a">보험금 청구에 필요한 동의예요</text>
<line x1="80" y1="684" x2="80" y2="766" stroke="#1d1b19" stroke-width="4"/>
<circle cx="80" cy="800" r="32" fill="#f4b400"/><text x="80" y="812" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">5</text>
<text x="135" y="794" font-size="29" font-weight="800" fill="#1d1b19">청구 내용과 계좌 입력</text>
<text x="135" y="836" font-size="24" fill="#615e5a">병원 간 날짜, 사유, 병원, 받을 계좌</text>
<line x1="80" y1="834" x2="80" y2="916" stroke="#1d1b19" stroke-width="4"/>
<circle cx="80" cy="950" r="32" fill="#f4b400"/><text x="80" y="962" font-size="32" font-weight="800" fill="#1d1b19" text-anchor="middle">6</text>
<text x="135" y="944" font-size="29" font-weight="800" fill="#1d1b19">서류 사진 등록</text>
<text x="135" y="986" font-size="24" fill="#615e5a">바로 찍거나 앨범에서 골라 올려요</text>
</svg>