<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 886" width="800" height="886" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>100만원 낼 때 비용 비교</title>
<rect width="800" height="886" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">100만원 낼 때 비용 비교</text>
<text x="40" y="114" font-size="25" fill="#615e5a">카드 할부·카드대금 이자는 빼고 비교했어요</text>
<rect x="40" y="150" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">신용카드로 기한 안에</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">수수료 0.7% = 7,000원</text>
<rect x="40" y="308" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="308" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="362" font-size="30" font-weight="800" fill="#1d1b19">체크카드로 기한 안에</text>
<text x="80" y="408" font-size="26" fill="#1d1b19">수수료 0.4% = 4,000원</text>
<rect x="40" y="466" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="466" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="520" font-size="30" font-weight="800" fill="#1d1b19">기한을 넘기면</text>
<text x="80" y="566" font-size="26" fill="#1d1b19">가산세 3% = 30,000원</text>
<text x="80" y="610" font-size="26" fill="#1d1b19">150만원 미만이라 월 단위 가산세는 없음</text>
<rect x="40" y="668" width="720" height="178" rx="22" fill="#f4b400" stroke="#1d1b19" stroke-width="0"/>
<text x="80" y="722" font-size="30" font-weight="800" fill="#1d1b19">정리</text>
<text x="80" y="768" font-size="26" fill="#1d1b19">기한을 넘기는 것보다</text>
<text x="80" y="812" font-size="26" fill="#1d1b19">카드로 기한 안에 내는 편이 적게 들어요</text>
</svg>
