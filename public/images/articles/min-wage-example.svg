<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 728" width="800" height="728" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>계산 예시(주 40시간, 2026년)</title>
<rect width="800" height="728" fill="#fdfaf2"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#1d1b19">계산 예시(주 40시간, 2026년)</text>
<text x="40" y="114" font-size="25" fill="#615e5a">기본급 190만원, 현금 식대 20만원</text>
<rect x="40" y="150" width="720" height="178" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="150" width="14" height="178" rx="7" fill="#f4b400"/>
<text x="80" y="204" font-size="30" font-weight="800" fill="#1d1b19">들어가는 돈</text>
<text x="80" y="250" font-size="26" fill="#1d1b19">190만원 + 20만원 = 210만원</text>
<text x="80" y="294" font-size="26" fill="#1d1b19">연장근로수당 15만원은 제외</text>
<rect x="40" y="352" width="720" height="134" rx="22" fill="#fff" stroke="#1d1b19" stroke-width="4"/>
<rect x="40" y="352" width="14" height="134" rx="7" fill="#f4b400"/>
<text x="80" y="406" font-size="30" font-weight="800" fill="#1d1b19">시간급으로 바꾸기</text>
<text x="80" y="452" font-size="26" fill="#1d1b19">210만원 ÷ 209시간 = 약 10,048원</text>
<rect x="40" y="510" width="720" height="178" rx="22" fill="#f4b400" stroke="#1d1b19" stroke-width="0"/>
<text x="80" y="564" font-size="30" font-weight="800" fill="#1d1b19">결과</text>
<text x="80" y="610" font-size="26" fill="#1d1b19">2026년 최저임금 10,320원보다 적음</text>
<text x="80" y="654" font-size="26" fill="#1d1b19">최저임금 미달</text>
</svg>
